<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Halo: Bolt Action Army Builder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
body {
  background: #202034;
  color: #f8f8fa;
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
}
.container {
  max-width: 1000px;
  margin: 32px auto;
  background: #232345;
  border-radius: 18px;
  padding: 36px 30px 26px 30px;
  box-shadow: 0 0 36px #000c;
  display: flex;
  flex-direction: row;
  gap: 38px;
  align-items: flex-start;
}
.main-content {
  flex: 1 1 0;
  min-width: 0;
}
.faction-select {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin: 38px 0 40px 0;
}
.faction-select button {
  font-size: 1.25em;
  min-width: 148px;
  padding: 20px 0;
}
.back-btn {
  display: none;
  background: #222b5b;
  font-size: 1.08em;
  border-radius: 7px;
  padding: 7px 18px;
  border: none;
  color: #fff;
  margin-bottom: 15px;
  transition: background .16s;
  width: auto;
  position: static;
}
.back-btn:hover { background: #2e50b7; }
.control-row {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
  align-items: center;
  margin-bottom: 27px;
}
.control-row select {
  font-size: 1em;
  background: #18182d;
  color: #f8f8fa;
  border-radius: 5px;
  border: 1px solid #223;
  padding: 7px 10px;
  min-width: 95px;
}
.army-list { margin: 22px 0 12px 0; }
.card {
  background: #242448;
  margin-bottom: 16px;
  border-radius: 8px;
  padding: 15px 18px 18px 18px;
  box-shadow: 0 2px 10px #0006;
}
.card h3 { margin: 0 0 7px 0; font-size: 1.13em; }
.card .details { margin: 4px 0 0 0; font-size: 0.98em; }
.card .details b { font-weight: 600; }
.remove-btn, .edit-btn {
  width: 48%;
  font-weight: bold;
  margin: 8px 1% 0 1%;
  padding: 8px 0;
  border-radius: 6px;
  display: inline-block;
  float: none;
}
.remove-btn { background: #b33b4b; }
.remove-btn:hover { background: #d34040; }
.edit-btn { background: #333; }
.edit-btn:hover { background: #555; }
button {
  background: #355fdc;
  color: #fff;
  border: none;
  padding: 8px 19px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 1em;
  transition: background .16s;
}
button.active, .faction-select button.active { background: #0e326e; font-weight: bold; }
button:not(.active):hover { background: #2e50b7; }
.total-points {
  margin: 18px 0 0 0;
  font-size: 1.22em;
  text-align: right;
  background: #1c1c38;
  border-radius: 9px;
  padding: 12px 0;
  font-weight: 700;
  letter-spacing: .01em;
}
.sticky-sidebar {
  position: sticky;
  top: 38px;
  right: 0;
  background: #242448;
  border-radius: 12px;
  box-shadow: 0 2px 18px #0008;
  padding: 24px 18px 20px 18px;
  min-width: 210px;
  width: 260px;
  max-width: 260px;
  flex: 0 0 260px;
  color: #e0e6f0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-wrap: anywhere;
  word-break: break-word;
}
#summaryBlock {
  max-width: 100%;
  overflow-wrap: anywhere;
  word-break: break-word;
}

#summaryBlock div {
  max-width: 100%;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.sticky-sidebar button {
  margin: 0 0 5px 0;
  width: 100%;
}
.sticky-sidebar .back-btn {
  background: #355fdc;
  color: #fff;
  font-weight: bold;
  border-radius: 7px;
  margin-bottom: 10px;
  display: block;
}
.sticky-sidebar .pdf-btn, .sticky-sidebar .save-btn {
  background: #355fdc;
  color: #fff;
  border-radius: 7px;
}
.sticky-sidebar .pdf-btn:hover, .sticky-sidebar .save-btn:hover, .sticky-sidebar .back-btn:hover {
  background: #2e50b7;
}

/* ======= MODAL FIX: SCROLLABLE CONTENT ======= */
.modal-bg {
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.65);
  display: none;              /* default hidden */
  align-items: center;
  justify-content: center;
}

.modal {
  background: #242448;
  color: #f8f8fa;
  border-radius: 16px;
  padding: 38px 36px;
  box-shadow: 0 0 28px #000b;
  min-width: 320px; min-height: 110px;
  max-width: 97vw;
  max-height: 87vh;      /* Fix: cap modal height */
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#modalFields {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;      /* Fix: scrollable content */
  margin-bottom: 18px;
  max-height: 54vh;      /* Tweak this if needed */
}
.modal label { display:block; margin-bottom:6px; }
.modal input[type="number"] { width:62px; }
.cost-preview {
  margin: 11px 0 14px 0;
  color: #7affb7;
  font-size: 1.14em;
  font-weight: 600;
  background: #192830;
  border-radius: 8px;
  padding: 10px 16px;
  display: inline-block;
  box-shadow: 0 1px 6px #1115;
}
@media (max-width: 1100px) {
  .container { flex-direction: column; gap: 0; max-width: 98vw; }
  .sticky-sidebar {
    position: static;
    margin: 0 auto 16px auto;
    min-width: 180px;
    width: 94vw;
    max-width: 380px;
    flex: none;
  }
  .main-content { width: 100%; }
}
@media (max-width: 730px) {
  .container { padding: 10px 1vw 20px 1vw; }
  .faction-select { gap: 10px; }
  .control-row { flex-direction: column; gap: 8px; }
  .total-points { text-align: left; }
  .modal { min-width: unset; padding: 19px 5vw; }
  #modalFields { max-height: 38vh; }
}
  </style>
</head>
<body>
  <div class="container">
    <div class="main-content">
      <button class="back-btn" id="backBtn" onclick="goBackToFaction()">&#8592; Back to Faction Select</button>
      <h1 style="text-align:center;margin-bottom:18px; font-size:2.3em; font-weight:800;">Halo: Bolt Action Army Builder</h1>
		<div class="faction-select" id="factionSelectRow">
		  <button onclick="selectFaction('UNSC')" id="btnUNSC">UNSC</button>
		  <button onclick="selectFaction('Covenant')" id="btnCovenant">Covenant</button>
		  <button onclick="selectFaction('Banished')" id="btnBanished">Banished</button>
		  <button onclick="selectFaction('Forerunner')" id="btnForerunner">Forerunner</button>
		  <button onclick="selectFaction('Flood')" id="btnFlood">Flood</button>
		  <button onclick="selectFaction('Other')" id="btnOther" style="display:none">Other Faction</button>
		</div>
		<div class="control-row" id="addControls" style="display:none;">
		  <select id="unitSelect"></select>
		  <select id="veterancySelect"></select>
		  <select id="armyBonusSelect" style="display:none;" onchange="onArmyBonusChange()"></select>
		  <button onclick="addSelectedUnit()">Add</button>
		  <!-- PDF button REMOVED here -->
		</div>
      <div class="army-list" id="armyList"></div>
      <div class="total-points" id="totalPointsDiv"></div>
    </div>
    <div class="sticky-sidebar" id="sidebar" style="display:none;">
      <button class="back-btn" onclick="goBackToFaction()">← Back</button>
      <button class="save-btn" onclick="saveList()">💾 Save List</button>
      <button class="save-btn" onclick="loadList()">📂 Load List</button>
		<button class="pdf-btn" onclick="exportPdf()">Export as PDF</button>

		<label style="display:block;margin-top:14px;font-size:0.98em;color:#dde;line-height:1.25;">
		  <input
			type="checkbox"
			id="simplifiedValidationToggle"
			checked
			onchange="setSimplifiedValidationEnabled(this.checked)"
			style="margin-right:6px;"
		  >
		  Use Simplified List Validation
		</label>

		<div id="summaryBlock" style="margin-top:22px;font-size:1.09em;"></div>
    </div>
  </div>

  <!-- Modal for editing -->
  <div class="modal-bg" id="editModalBg">
    <div class="modal" id="editModal">
      <div id="modalFields"></div>
      <div class="cost-preview" id="modalCostPreview"></div>
      <div style="margin-top:15px;">
        <button onclick="saveEdit()">Save</button>
        <button onclick="closeEditModal()" style="background:#b33b4b;margin-left:10px;">Cancel</button>
      </div>
    </div>
  </div>

// --- Weapon Special Rule Descriptions ---
const weaponSpecialDescriptions = {
  "AT Gun": "All anti-tank guns, from light to super-heavy, including vehicle-mounted anti-tank guns, gain +1 to hit vehicles (Not vs flying aircraft) when firing with a Fire order, including Ambush and reaction fire.",
  "Assault": "No -1 to hit when moving and shooting. Models with an Assault weapon gain Tough Fighters: When fighting in close quarters against Infantry, Artillery, or Assault Walkers, a unit may re-roll a number of failed melee rolls up to the number of friendly models with Tough Fighters taking part in that fight.",
  "Battery Charge": "Has a -1 penalty to hit when shooting.",
  "Cover Piercing": "When this weapon hits an Infantry or Artillery unit that is in soft/hard cover and not Down, any natural 6 rolled to Wound worsens the target’s cover save by 1, for that wound only.",
  "Fixed": "Fixed weapons can only fire within a 45-degree arc. A Run order must be used to reposition them.",
  "Flamethrower": "Roll 1 die to hit. If it hits, an infantry Flamethrower inflicts D6 hits, while a vehicle-mounted Flamethrower inflicts D6+1 hits. No cover saves, including Down saves. Target takes D3+1 Pins and must pass Morale or be destroyed/knocked out. Hits vehicles on top armour and ignores long/point-blank Pen modifiers. Fuel may run out after use. Against buildings, needs an opening and may set normal buildings on fire on 4+ even if it misses.",

Hidden Sentries

- Effect:
Enemy units using the Infiltrator special rule cannot deploy within 24" of any Insurrectionist unit that was set up on the table before them, instead of the usual 12". If this prevents an enemy Infiltrator unit from being legally deployed, that unit must be deployed as if it did not have Infiltrator instead.

Concealed Firing Positions

- Effect:
Insurrectionist Infantry and Artillery units improve their Cover Save by +1 while they have an Ambush order, as long as they are already in cover.

Ambush Drills

- Effect:
When an Insurrectionist Infantry unit is given an Advance order without using Flight, it may choose to go Down instead of firing. If it does so, resolve the unit’s Advance movement as normal, then replace its Advance order die with a Down order die. The unit may not fire, and its activation is complete.


Local Area Control

- Effect:
When an Insurrectionist Infantry unit attempts to enter the battlefield by Reserves or Outflanking, it gains +1 to its Morale value for the Order test made to come onto the table.
`,

Sangheili Command

Disciplined Under Fire

- Effect:
Each time a Veteran Swords of Sanghelios unit would gain 2 or more Pin markers from HE or another source, reduce the number of Pin markers gained by 1.

Rite of Challenge

- Effect:
When an Elite Infantry unit that includes at least one model with a Melee Weapon is given a Run order to assault an enemy unit, it counts as having the Fieldcraft special rule for that action.

War-Chants of Sanghelios

- Effect:
At the start of every Game Turn, roll a D6 for each enemy Infantry and Artillery unit on the table that has no Pin markers. On a 5+, that unit immediately receives 1 Pin marker. Do not roll for units embarked inside transports.

//Armoury Helpers

function getArmouryDefsForCurrentFaction() {
  return ARMOURY_DEFS?.[window.currentFaction] || [];
}

function applyArmouryToUnitData(unit, rawUnitData) {
  if (!unit || !rawUnitData) return rawUnitData;

  const unitData = cloneUnitData(rawUnitData);
  unitData.options = unitData.options || {};
  unitData.options.squadUpgrades = unitData.options.squadUpgrades || {};
  unitData.options.weaponUpgrades = unitData.options.weaponUpgrades || {};

  const defs = getArmouryDefsForCurrentFaction();

  defs.forEach(def => {
    if (!def.appliesTo || !def.appliesTo(unit, unitData)) return;

    if (def.type === "ruleCheckbox") {
      unitData.options.squadUpgrades[def.label] = {
        cost: def.cost,
        perModel: def.costMode !== "flat",
        grantsRule: def.grantsRules?.length === 1 ? def.grantsRules[0] : def.grantsRules
      };
    }

    if (def.type === "vehicleRuleCheckbox") {
      unitData.options.weaponUpgrades[def.label] = {
        cost: def.cost,
        grantsRule: def.grantsRules?.length === 1 ? def.grantsRules[0] : def.grantsRules
      };
    }

    if (def.type === "weaponProfileSwap") {
      unitData.options.squadUpgrades[def.label] = {
        cost: def.cost,
        perModel: def.costMode !== "flat",
        profileSwap: true,
        fromWeapon: def.fromWeapon,
        toWeapon: def.toWeapon
      };
    }
  });

  return unitData;
}

function applyVolatileBiomassSpecialRules(unit, specialRules) {
  if (!unit?.squadUpgrades?.["Volatile Biomass"]) return specialRules;

  return (specialRules || []).map(rule => {
    const name = typeof rule === "string" ? rule.split(":")[0].trim() : rule?.name;

    if (name === "Suicide Charge") {
      return {
        name: "Suicide Charge",
        description: "If this model successfully assaults an enemy unit, it is immediately destroyed, and Volatile Biomass takes effect. Additionally, while this unit is on Ambush, if an enemy Infantry or Artillery unit ends a movement within 6\" and line of sight of it, instead of firing, you may immediately flip its Ambush order to Run and declare an assault against that enemy unit before it has a chance to fire."
      };
    }

    if (name === "Explosive Biomass") {
      return {
        name: "Volatile Biomass",
        description: "If this model is destroyed, the enemy unit it is fighting in close quarters suffers a HE (2\") hit. Being Down does not halve hits for this attack."
      };
    }

    return rule;
  });
}

const M301_SUFFIX = " + M301 Grenade Launcher";
const M301_CARRIER_WEAPONS = ["Assault Rifle", "Battle Rifle", "Infantry Flamethrower"];

function isM301ComboWeapon(name) {
  return String(name || "").includes(M301_SUFFIX);
}

function getM301CarrierWeapon(name) {
  return String(name || "").replace(M301_SUFFIX, "").trim();
}

function makeM301ComboWeapon(baseWeapon) {
  return `${baseWeapon}${M301_SUFFIX}`;
}

function isM301ReplacementLabel(label) {
  return String(label || "").includes(M301_SUFFIX);
}

function getM301Max(unit) {
  return Math.floor((Number(unit?.men) || 0) / 4);
}

function isChooseAnyWeaponUnit(unit, unitData) {
  if (!unit || !unitData) return false;

  const replacements = Object.values(unitData.options?.weaponReplacements || {});
  const hasOnlyGeneratedM301Replacements =
    replacements.length === 0 || replacements.every(spec => spec?.isM301);

  return (
    unit.type === "Infantry" &&
    Array.isArray(unitData.weapons) &&
    unitData.weapons.length > 1 &&
    hasOnlyGeneratedM301Replacements
  );
}

function getM301Selections(unit, unitData) {
  const selections = [];

  if (unit?.weaponReplacements && unitData?.options?.weaponReplacements) {
    Object.entries(unit.weaponReplacements).forEach(([label, qty]) => {
      const count = Number(qty) || 0;
      if (count <= 0) return;

      const spec = unitData.options.weaponReplacements[label];
      const granted = spec?.grants || label;

      if (isM301ComboWeapon(granted)) {
        selections.push({
          role: "model",
          baseWeapon: getM301CarrierWeapon(granted),
          count
        });
      }
    });
  }

  if (isM301ComboWeapon(unit?.ncoReplacement)) {
    selections.push({
      role: "nco",
      baseWeapon: getM301CarrierWeapon(unit.ncoReplacement),
      count: 1
    });
  }

  return selections;
}

function getM301SelectionCount(unit, unitData) {
  return getM301Selections(unit, unitData)
    .reduce((sum, s) => sum + (Number(s.count) || 0), 0);
}

function unitHasM301(unit, unitData = getUnitData(unit)) {
  if (!unit) return false;

  if (isM301ComboWeapon(unit.ncoReplacement)) return true;

  if (unitData) {
    return getM301SelectionCount(unit, unitData) > 0;
  }

  return Object.entries(unit.weaponReplacements || {}).some(([label, qty]) =>
    isM301ReplacementLabel(label) && (Number(qty) || 0) > 0
  );
}

function getBaseWeaponReplacementCost(unitData, weaponName) {
  const defaultWeapon = getBaseWeaponName(unitData?.weapons?.[0]?.name);

  if (defaultWeapon === weaponName) return 0;

  const replacements = unitData?.options?.weaponReplacements || {};
  for (const spec of Object.values(replacements)) {
    if (getBaseWeaponName(spec.grants) === weaponName) {
      return Number(spec.cost) || 0;
    }
  }

  // Choose-any units like Officers may have AR/BR as profile weapons.
  const hasProfileWeapon = (unitData?.weapons || []).some(w => getBaseWeaponName(w.name) === weaponName);
  if (hasProfileWeapon) return 0;

  return null;
}

function getBaseNcoWeaponCost(unitData, weaponName) {
  const nco = unitData?.options?.ncoReplacement;

  if (!nco) return null;
  if (!nco.options?.includes(weaponName)) return null;

  return Number(nco.costs?.[weaponName] || 0);
}

function injectM301Options(unit, unitData) {
  if (!unit || !unitData) return unitData;

  const eligible =
    window.currentFaction === "UNSC" &&
    unit.type === "Infantry" &&
    isMarineODSTOrSpartan(unit, unitData);

  if (!eligible) return unitData;

  const maxM301 = Math.floor((unitData.maxMen || unit.men || 0) / 4);
  if (maxM301 < 1) return unitData;

  unitData.options = unitData.options || {};
  unitData.options.weaponReplacements = unitData.options.weaponReplacements || {};

  const chooseAny = isChooseAnyWeaponUnit(unit, unitData);

  M301_CARRIER_WEAPONS.forEach(baseWeapon => {
    const baseCost = getBaseWeaponReplacementCost(unitData, baseWeapon);
    if (baseCost === null) return;

    const combo = makeM301ComboWeapon(baseWeapon);

    unitData.options.weaponReplacements[combo] = {
      max: maxM301,
      cost: baseCost + 22,
      replaces: unitData.weapons?.[0]?.name || baseWeapon,
      grants: combo,
      isM301: true
    };
  });

  if (chooseAny && !unitData.options.ncoReplacement) {
    unitData.options.ncoReplacement = {
      options: [],
      costs: {}
    };

    (unitData.weapons || []).forEach(w => {
      const base = getBaseWeaponName(w.name);
      if (!unitData.options.ncoReplacement.options.includes(base)) {
        unitData.options.ncoReplacement.options.push(base);
      }
      unitData.options.ncoReplacement.costs[base] = 0;
    });
  }

  if (unitData.options.ncoReplacement) {
    M301_CARRIER_WEAPONS.forEach(baseWeapon => {
      const baseCost = chooseAny
        ? getBaseWeaponReplacementCost(unitData, baseWeapon)
        : getBaseNcoWeaponCost(unitData, baseWeapon);

      if (baseCost === null) return;

      const combo = makeM301ComboWeapon(baseWeapon);

      if (!unitData.options.ncoReplacement.options.includes(combo)) {
        unitData.options.ncoReplacement.options.push(combo);
      }

      unitData.options.ncoReplacement.costs[combo] = baseCost + 22;
    });
  }

  return unitData;
}

function isLeaderMeleeComboWeapon(weaponName) {
  return [
    "Plasma Rifle + Plasma Sword",
    "Needler + Plasma Sword",
    "Gravity Hammer"
  ].includes(weaponName);
}

function isPlasmaSwordComboWeapon(weaponName) {
  return weaponName === "Plasma Rifle + Plasma Sword" || weaponName === "Needler + Plasma Sword";
}

function getPlasmaSwordComboRangedWeapon(weaponName) {
  if (weaponName === "Plasma Rifle + Plasma Sword") return "Plasma Rifle";
  if (weaponName === "Needler + Plasma Sword") return "Needler";
  return null;
}

function isLeaderStyleInfantryProfile(unit) {
  const name = String(unit?.name || "");

  return /Officer|Forward Observer|Medic|Chaplain|Bloodhandler|Attached Leader/i.test(name);
}

function clearIllegalLeaderMeleeSelections(unit, unitData) {
  if (!unit) return;

  unit.leaderMeleeUpgrade = "";

  if (isPlasmaSwordComboWeapon(unit.ncoReplacement)) {
    const baseWeapon = getPlasmaSwordComboRangedWeapon(unit.ncoReplacement);
    const options = unitData?.options?.ncoReplacement?.options || [];

    unit.ncoReplacement = options.includes(baseWeapon)
      ? baseWeapon
      : options[0] || undefined;
  }

  if (unit.ncoReplacement === "Gravity Hammer") {
    const options = unitData?.options?.ncoReplacement?.options || [];
    unit.ncoReplacement = options[0] || undefined;
  }
}

function injectLeaderMeleeNcoOptions(unit, unitData) {
  if (!unit || !unitData) return unitData;
  if (unit.type !== "Infantry") return unitData;

  const hasMeleeWeapon = leaderHasMeleeWeapon(unit, unitData);

  // If the model no longer has Melee Weapon, remove any illegal sword/hammer choices.
  if (!hasMeleeWeapon) {
    clearIllegalLeaderMeleeSelections(unit, unitData);
    return unitData;
  }

  unitData.options = unitData.options || {};

  // Leader-style profiles, like Officers, should NOT get an NCO Weapon dropdown.
  // They keep their normal "choose any weapon" display and use Leader Melee Upgrade instead.
  if (!unitData.options.ncoReplacement && isLeaderStyleInfantryProfile(unit)) {
    return unitData;
  }

  // If the unit does not already have an NCO weapon dropdown, create one
  // from its normal ranged weapon and relevant replacement options.
  // This is for squads like Spec Ops Team, not Officers.
  if (!unitData.options.ncoReplacement) {
    const options = [];
    const costs = {};

    const addBaseOption = (weaponName, cost = 0) => {
      const base = getBaseWeaponName(weaponName);
      if (!base) return;
      if (base === "Unarmed") return;
      if (base === "Melee Weapon" || base === "Melee Weapons") return;

      if (!options.includes(base)) {
        options.push(base);
        costs[base] = cost;
      }
    };

    (unitData.weapons || []).forEach(w => {
      addBaseOption(w.name, 0);
    });

    Object.values(unitData.options.weaponReplacements || {}).forEach(repl => {
      if (!repl?.grants) return;

      const granted = getBaseWeaponName(repl.grants);

      if (
        granted === "Plasma Rifle" ||
        granted === "Needler" ||
        granted === "Spiker"
      ) {
        addBaseOption(granted, Number(repl.cost) || 0);
      }
    });

    if (options.length > 0) {
      unitData.options.ncoReplacement = {
        options,
        costs
      };
    } else {
      return unitData;
    }
  }

  const caste = getCurrentLeaderCaste(unit, unitData);
  const discount = unitHasToughFightersSpecialRule(unit, unitData) ? 1 : 0;

  unitData.options.ncoReplacement.options = unitData.options.ncoReplacement.options || [];
  unitData.options.ncoReplacement.costs = unitData.options.ncoReplacement.costs || {};

  const addNcoOption = (label, cost) => {
    if (!unitData.options.ncoReplacement.options.includes(label)) {
      unitData.options.ncoReplacement.options.push(label);
    }
    unitData.options.ncoReplacement.costs[label] = cost;
  };

  if (caste === "Elite") {
    if (unitData.options.ncoReplacement.options.includes("Plasma Rifle")) {
      const baseCost = Number(unitData.options.ncoReplacement.costs["Plasma Rifle"] || 0);
      addNcoOption("Plasma Rifle + Plasma Sword", baseCost + 5 - discount);
    }

    if (unitData.options.ncoReplacement.options.includes("Needler")) {
      const baseCost = Number(unitData.options.ncoReplacement.costs["Needler"] || 0);
      addNcoOption("Needler + Plasma Sword", baseCost + 5 - discount);
    }
  }

  if (caste === "Brute") {
    const canTakeHammer =
      unitData.options.ncoReplacement.options.includes("Spiker") ||
      unitData.options.ncoReplacement.options.includes("Plasma Rifle");

    if (canTakeHammer) {
      addNcoOption("Gravity Hammer", 0 - discount);
    }
  }

  // If the unit had an old saved NCO weapon from another doctrine,
  // clear it so Brutes cannot keep Plasma Sword and Elites cannot keep Gravity Hammer.
  const validNcoOptions = unitData.options.ncoReplacement.options || [];
  if (unit.ncoReplacement && !validNcoOptions.includes(unit.ncoReplacement)) {
    unit.ncoReplacement = validNcoOptions[0] || undefined;
  }

  return unitData;
}

}

function unitRuleNames(unit, unitData = null) {
  const rules = [
    ...(Array.isArray(unit?.special) ? unit.special : []),
    ...(Array.isArray(unit?.specialRules) ? unit.specialRules : []),
    ...(Array.isArray(unitData?.specialRules) ? unitData.specialRules : [])
  ];

  return rules.map(r => getRuleName(r)).filter(Boolean);
}

function unitHasRuleName(unit, ruleName, unitData = null) {
  return unitRuleNames(unit, unitData).includes(ruleName);
}

function unitHasPickedUpgradeContaining(unit, text) {
  return Object.entries(unit?.squadUpgrades || {}).some(([label, picked]) =>
    picked && String(label).toLowerCase().includes(String(text).toLowerCase())
  );
}

function getForceOrgSlot(unit, unitData = getUnitData(unit)) {
  return String(unit?.forceOrgSlot || unitData?.forceOrgSlot || "").toLowerCase();
}

function isGruntDeaconForValidation(unit) {
  const unitData = getUnitData(unit);

  return (
    unitHasPickedUpgradeContaining(unit, "Deacon") ||
    unitHasRuleName(unit, "Deacon", unitData) ||
    String(unit?.name || "").toLowerCase().includes("deacon")
  );
}

function isPlatoonCommanderForValidation(unit) {
  const unitData = getUnitData(unit);
  if (!unit || !unitData) return false;

  // Grunt Deacon follows some officer rules, but does NOT fill the Platoon Commander slot.
  if (isGruntDeaconForValidation(unit)) return false;

  // Knight Commander upgrade fills the Platoon Commander slot.
  if (unitHasPickedUpgradeContaining(unit, "Knight Commander")) return true;

  // Optional manual override.
  const slot = getForceOrgSlot(unit, unitData);
  if (
    slot === "platooncommander" ||
    slot === "platoon_commander" ||
    slot === "platoon-commander"
  ) {
    return true;
  }

  // Main rule-based check.
  return unitHasRuleName(unit, "Platoon Commander", unitData);
}

function isSupportOrExtraHQForValidation(unit) {
  const unitData = getUnitData(unit);
  const name = String(unit?.name || "").toLowerCase();

  return (
    unitHasRuleName(unit, "HQ Choice", unitData) ||
    unitHasRuleName(unit, "Company Commander", unitData) ||
    unitHasRuleName(unit, "Medic", unitData) ||
    unitHasRuleName(unit, "Forward Observer", unitData) ||
    unitHasRuleName(unit, "Chaplain", unitData) ||
    unitHasRuleName(unit, "Bloodhandler", unitData) ||
    unitHasRuleName(unit, "Watcher", unitData) ||
    unitHasRuleName(unit, "Utility Construct", unitData) ||
    name.includes("company commander") ||
    name.includes("medic") ||
    name.includes("forward observer") ||
    name.includes("observer") ||
    name.includes("chaplain") ||
    name.includes("bloodhandler") ||
    name.includes("watcher") ||
    name.includes("attached leader") ||
    name.includes("huragok")
  );
}

function isRequiredInfantryForValidation(unit) {
  const unitData = getUnitData(unit);
  if (!unit || !unitData) return false;

  // Platoon Commanders do not count as one of their own required Infantry units.
  if (isPlatoonCommanderForValidation(unit)) return false;

  // Medics, Company Commanders, Forward Observers, HQ Choice units, etc.
  // do not count toward required Infantry, even if their type is Infantry.
  if (isSupportOrExtraHQForValidation(unit)) return false;

  const slot = getForceOrgSlot(unit, unitData);

  // Optional manual override.
  // Keep this after the exclusions above.
  if (slot) return slot === "infantry";

  // Only real Infantry squads count.
  // Teams and Artillery do not count.
  return unit.type === "Infantry";
}

function isTransportForValidation(unit) {
  const unitData = getUnitData(unit);
  const slot = getForceOrgSlot(unit, unitData);

  return slot === "transport";
}

function isRiflePlatoonUnitForTransportLimit(unit) {
  const unitData = getUnitData(unit);
  if (!unit || !unitData) return false;

  // Transport-category vehicles do not unlock more transports.
  if (isTransportForValidation(unit)) return false;

  // Support / extra HQ units do not unlock transports.
  if (isSupportOrExtraHQForValidation(unit)) return false;

  // Platoon Commander does count as a Rifle Platoon unit.
  if (isPlatoonCommanderForValidation(unit)) return true;

  const slot = getForceOrgSlot(unit, unitData);

  // Optional manual override.
  if (
    slot === "infantry" ||
    slot === "team" ||
    slot === "artillery"
  ) {
    return true;
  }

  // Normal Rifle Platoon units.
  // If you do NOT want Teams to unlock transports, remove "Team" here.
  return ["Infantry", "Team", "Artillery"].includes(unit.type);
}

function isCombatVehicleForValidation(unit) {
  if (!unit) return false;

  // Infantry, Teams, and Artillery are not Combat Vehicles.
  if (["Infantry", "Team", "Artillery"].includes(unit.type)) return false;

  // Transport-category vehicles are handled by the transport limit instead.
  if (isTransportForValidation(unit)) return false;

  return true;
}

function isCommandVehicleForValidation(unit) {
  const unitData = getUnitData(unit);

  // Transport-category vehicles cannot count as Command Vehicles.
  if (isTransportForValidation(unit)) return false;

  return (
    !!unit?.forcedCommandVehicle ||
    unit?.selectedUpgrades?.includes("Command Vehicle") ||
    unitHasRuleName(unit, "Command Vehicle", unitData)
  );
}

function hasRawRuleForXM20P(unit, ruleName) {
  const rules = [
    ...(Array.isArray(unit?.special) ? unit.special : []),
    ...(Array.isArray(unit?.specialRules) ? unit.specialRules : [])
  ];

  return rules.some(rule => getRuleName(rule) === ruleName);
}

function isUNSCPlatoonCommanderForXM20P(unit) {
  const name = String(unit?.name || "").toLowerCase();

  // IMPORTANT:
  // Do not call getUnitData() here.
  // This is used inside armoury appliesTo checks, so it must avoid recursion.
  return (
    window.currentFaction === "UNSC" &&
    (
      name.includes("platoon commander") ||
      hasRawRuleForXM20P(unit, "Platoon Commander")
    )
  );
}

function isXM20PUnit(unit) {
  return !!unit?.squadUpgrades?.["XM20P Grenades"];
}

function getXM20PAllowedCount() {
  return (window.armyList || []).filter(isUNSCPlatoonCommanderForXM20P).length;
}

function getXM20PSelectedCount(exceptUnit = null) {
  return (window.armyList || []).filter(unit =>
    unit !== exceptUnit &&
    isXM20PUnit(unit)
  ).length;
}

function canTakeXM20PGrenades(unit, unitData) {
  if (window.currentFaction !== "UNSC") return false;
  if (!unit || !unitData) return false;
  if (unit.name !== "Grenade Launcher Team") return false;

  // Keep showing it on the unit that already has it, so it can be unticked.
  if (unit.squadUpgrades?.["XM20P Grenades"]) return true;

  const allowed = getXM20PAllowedCount();
  const alreadyTaken = getXM20PSelectedCount(unit);

  return alreadyTaken < allowed;
}

function enforceXM20PGrenadeLimit() {
  if (window.currentFaction !== "UNSC") return;

  const maxAllowed = getXM20PAllowedCount();
  let kept = 0;

  (window.armyList || []).forEach(unit => {
    if (!unit?.squadUpgrades?.["XM20P Grenades"]) return;

    const legalUnit = unit.name === "Grenade Launcher Team";

    if (legalUnit && kept < maxAllowed) {
      kept++;
      return;
    }

    const costToRemove = getSquadUpgradeCostForUnit(unit, "XM20P Grenades");

    unit.squadUpgrades["XM20P Grenades"] = false;
    unit.cost = Math.max(0, (Number(unit.cost) || 0) - costToRemove);

    removeSpecialRuleByName(unit, "XM20P Grenades");
    unit.weaponsTable = buildWeaponsTable(unit);
  });
}

function getJackalDefenseGauntletForbiddenWeapons(unit, unitData) {
  if (!unit || !unitData) return [];
  if (unit.name !== "Jackal Squad") return [];

  if (window.currentFaction === "Covenant") {
    return ["Carbine", "Needle Rifle"];
  }

  if (window.currentFaction === "Banished") {
    return ["Pulse Carbine", "Stalker Rifle"];
  }

  return [];
}

function isJackalDefenseGauntletForbiddenWeapon(unit, unitData, weaponName) {
  const forbidden = getJackalDefenseGauntletForbiddenWeapons(unit, unitData);
  if (!forbidden.length) return false;

  const base = getBaseWeaponName(weaponName);
  const raw = String(weaponName || "").toLowerCase();

  return forbidden.some(name =>
    base === name || raw.includes(name.toLowerCase())
  );
}

function jackalHasForbiddenDefenseGauntletWeapon(unit, unitData, useEditor = true) {
  if (!unit || !unitData) return false;
  if (unit.name !== "Jackal Squad") return false;

  const forbidden = getJackalDefenseGauntletForbiddenWeapons(unit, unitData);
  if (!forbidden.length) return false;

  // Check NCO weapon.
  let ncoWeapon = "";
  if (useEditor) {
    ncoWeapon = document.getElementById("editNcoReplacement")?.value || "";
  }

  ncoWeapon =
    ncoWeapon ||
    unit.ncoReplacement ||
    unitData.options?.ncoReplacement?.options?.[0] ||
    "";

  if (isJackalDefenseGauntletForbiddenWeapon(unit, unitData, ncoWeapon)) {
    return true;
  }

  // Check currently edited weapon replacement inputs.
  const editorInputs = useEditor
    ? Array.from(document.querySelectorAll(".editWeaponReplacement"))
    : [];

  if (editorInputs.length) {
    return editorInputs.some(input => {
      const qty = parseInt(input.value, 10) || 0;
      if (qty <= 0) return false;

      const label = input.dataset.label;
      const spec = unitData.options?.weaponReplacements?.[label];
      const granted = spec?.grants || label;

      return (
        isJackalDefenseGauntletForbiddenWeapon(unit, unitData, granted) ||
        isJackalDefenseGauntletForbiddenWeapon(unit, unitData, label)
      );
    });
  }

  // Check saved weapon replacements.
  return Object.entries(unit.weaponReplacements || {}).some(([label, qty]) => {
    if ((Number(qty) || 0) <= 0) return false;

    const spec = unitData.options?.weaponReplacements?.[label];
    const granted = spec?.grants || label;

    return (
      isJackalDefenseGauntletForbiddenWeapon(unit, unitData, granted) ||
      isJackalDefenseGauntletForbiddenWeapon(unit, unitData, label)
    );
  });
}

function getRuleTextForValidation(rule) {
  if (!rule) return "";
  if (typeof rule === "string") return rule;
  if (rule.name) return rule.description ? `${rule.name}: ${rule.description}` : rule.name;
  return "";
}

function unitRuleTextsForValidation(unit, unitData = getUnitData(unit)) {
  return [
    ...(Array.isArray(unit?.special) ? unit.special : []),
    ...(Array.isArray(unit?.specialRules) ? unit.specialRules : []),
    ...(Array.isArray(unitData?.specialRules) ? unitData.specialRules : [])
  ].map(getRuleTextForValidation).filter(Boolean);
}

function isKnightCommanderForValidation(unit) {
  return (
    unitHasPickedUpgradeContaining(unit, "Knight Commander") ||
    unitHasRuleName(unit, "Knight Commander", getUnitData(unit)) ||
    String(unit?.name || "").toLowerCase().includes("knight commander")
  );
}

function isMedicSlotForValidation(unit) {
  const unitData = getUnitData(unit);
  const name = String(unit?.name || "").toLowerCase();

  return (
    unitHasRuleName(unit, "Medic", unitData) ||
    name.includes("medic")
  );
}

function isObserverSlotForValidation(unit) {
  const unitData = getUnitData(unit);
  const name = String(unit?.name || "").toLowerCase();

  return (
    unitHasRuleName(unit, "Forward Observer", unitData) ||
    unitHasRuleName(unit, "Watcher", unitData) ||
    name.includes("forward observer") ||
    name.includes("observer") ||
    name.includes("watcher")
  );
}

function isSpiritualHQSlotForValidation(unit) {
  const unitData = getUnitData(unit);
  const name = String(unit?.name || "").toLowerCase();

  return (
    unitHasRuleName(unit, "Chaplain", unitData) ||
    unitHasRuleName(unit, "Bloodhandler", unitData) ||
    name.includes("chaplain") ||
    name.includes("bloodhandler")
  );
}

function isCompanyCommanderForValidation(unit) {
  const unitData = getUnitData(unit);
  const name = String(unit?.name || "").toLowerCase();

  return (
    unitHasRuleName(unit, "Company Commander", unitData) ||
    name.includes("company commander")
  );
}

function pushMaxIssue(issues, label, current, max, suffix) {
  if (current > max) {
    issues.push(`Too many ${label}. Current: ${current}, Max: ${max}${suffix ? " " + suffix : ""}`);
  }
}

function getLimitedRulesForUnit(unit) {
  const texts = unitRuleTextsForValidation(unit);
  return texts.filter(text => /^Limited\b/i.test(text) || /\bLimited:/i.test(text));
}

function getLimitedArmyMax(text) {
  const s = String(text || "");

  const totalMatch = s.match(/only\s+(?:up to\s+)?(\d+)\s+in total per army/i);
  if (totalMatch) return Number(totalMatch[1]);

  const armyMatch = s.match(/only\s+(?:up to\s+)?(\d+).*per army/i);
  if (armyMatch) return Number(armyMatch[1]);

  return null;
}

function getLimitedPerPlatoonMax(text) {
  const s = String(text || "");

  const platoonMatch = s.match(/only\s+(?:up to\s+)?(\d+).*per platoon/i);
  if (platoonMatch) return Number(platoonMatch[1]);

  // Fallback for wording like "Limited: may only be taken once per platoon"
  if (/per platoon/i.test(s)) return 1;

  return null;
}

function isUpgradeLimitHandledSeparately(text) {
  const s = String(text || "");

  // These are upgrades inside a unit, not limits on the unit itself.
  // They are checked separately by isKnightCommanderForValidation()
  // and isGruntDeaconForValidation().
  return /Knight Commander/i.test(s) || /Deacon/i.test(s);
}

function addLimitedRuleValidation(issues, units, platoonCommanderCount) {
  const grouped = new Map();

  units.forEach(unit => {
    const limitedRules = getLimitedRulesForUnit(unit)
      .filter(ruleText => !isUpgradeLimitHandledSeparately(ruleText));

    if (!limitedRules.length) return;

    const key = unit.name || "Unknown Unit";

    if (!grouped.has(key)) {
      grouped.set(key, {
        name: key,
        count: 0,
        armyMax: null,
        perPlatoonMax: null
      });
    }

    const entry = grouped.get(key);
    entry.count += 1;

    limitedRules.forEach(ruleText => {
      const armyMax = getLimitedArmyMax(ruleText);
      if (armyMax !== null) {
        entry.armyMax = entry.armyMax === null ? armyMax : Math.min(entry.armyMax, armyMax);
      }

      const perPlatoonMax = getLimitedPerPlatoonMax(ruleText);
      if (perPlatoonMax !== null) {
        entry.perPlatoonMax =
          entry.perPlatoonMax === null
            ? perPlatoonMax
            : Math.min(entry.perPlatoonMax, perPlatoonMax);
      }
    });
  });

  grouped.forEach(entry => {
    if (entry.armyMax !== null) {
      pushMaxIssue(issues, entry.name, entry.count, entry.armyMax, "per army");
    }

    if (entry.perPlatoonMax !== null && platoonCommanderCount > 0) {
      const maxAllowed = entry.perPlatoonMax * platoonCommanderCount;
      pushMaxIssue(issues, entry.name, entry.count, maxAllowed, "per Platoon Commander");
    }
  });
}

function isSimplifiedValidationEnabled() {
  const stored = localStorage.getItem("haloSimplifiedValidationEnabled");
  return stored === null ? true : stored === "true";
}

function setSimplifiedValidationEnabled(enabled) {
  localStorage.setItem("haloSimplifiedValidationEnabled", enabled ? "true" : "false");
  syncSimplifiedValidationToggle();
  renderSummaryBlock();
}

function syncSimplifiedValidationToggle() {
  const toggle = document.getElementById("simplifiedValidationToggle");
  if (!toggle) return;
  toggle.checked = isSimplifiedValidationEnabled();
}

function getArmyValidation() {
  const units = window.armyList || [];

  const platoonCommanders = units.filter(isPlatoonCommanderForValidation);
  const infantryUnits = units.filter(isRequiredInfantryForValidation);

  const transports = units.filter(isTransportForValidation);
  const riflePlatoonUnits = units.filter(isRiflePlatoonUnitForTransportLimit);

  const combatVehicles = units.filter(isCombatVehicleForValidation);
  const commandVehicles = combatVehicles.filter(isCommandVehicleForValidation);

  const issues = [];
  const ok = [];

  const platoonCommanderCount = platoonCommanders.length;

  // Minimum list always needs at least 1 Platoon Commander.
  // It also needs 2 Infantry units per Platoon Commander.
  // If there are 0 commanders, still show the minimum requirement of 2 Infantry.
  const requiredInfantry = Math.max(1, platoonCommanderCount) * 2;

  // Core Rifle Platoon requirements.
  if (platoonCommanderCount < 1) {
    issues.push(`Missing Platoon Commander. Current: ${platoonCommanderCount}`);
  } else {
    ok.push(`Platoon Commander. Current: ${platoonCommanderCount}`);
  }

  if (infantryUnits.length < requiredInfantry) {
    issues.push(`Needs ${requiredInfantry} Infantry units. Current: ${infantryUnits.length}`);
  } else {
    ok.push(`Infantry units. Current: ${infantryUnits.length}`);
  }

  // Transport limit:
  // 1 transport-category vehicle may be taken for each valid Rifle Platoon unit.
  if (transports.length > riflePlatoonUnits.length) {
    issues.push(`Too many Transports. Current: ${transports.length}, Max: ${riflePlatoonUnits.length}`);
  } else if (transports.length > 0) {
    ok.push(`Transports. Current: ${transports.length}/${riflePlatoonUnits.length}`);
  }

  // Armoured Platoon / Combat Vehicle requirements.
  // Official-style logic:
  // Each Armoured Platoon needs 2–5 Combat Vehicles total.
  // Each Armoured Platoon needs at least 1 Command Vehicle.
  //
  // Extra Command Vehicles do not automatically create extra platoons.
  // A second Armoured Platoon only exists if there are at least 4 Combat Vehicles total:
  // 2 vehicles for the first platoon, and 2 vehicles for the second.
  if (combatVehicles.length > 0) {
    const commandVehicleCount = commandVehicles.length;
    const combatVehicleCount = combatVehicles.length;

    const requiredCommandVehicles = Math.ceil(combatVehicleCount / 5);
    const maxPossiblePlatoonsByVehicleCount = Math.floor(combatVehicleCount / 2);
    const usableArmouredPlatoons = Math.min(commandVehicleCount, maxPossiblePlatoonsByVehicleCount);
    const maxCombatVehicles = usableArmouredPlatoons * 5;

    if (commandVehicleCount < requiredCommandVehicles) {
      if (requiredCommandVehicles === 1) {
        issues.push(`Armoured platoon needs 1 Command Vehicle. Current: ${commandVehicleCount}`);
      } else {
        issues.push(`Needs ${requiredCommandVehicles} Command Vehicles. Current: ${commandVehicleCount}`);
      }
    } else {
      ok.push(`Command Vehicles. Current: ${commandVehicleCount}`);
    }

    if (combatVehicleCount < 2) {
      issues.push(`Armoured platoon needs 2 Combat Vehicles. Current: ${combatVehicleCount}`);
    }

    if (
      commandVehicleCount >= requiredCommandVehicles &&
      combatVehicleCount >= 2
    ) {
      ok.push(`Combat Vehicles. Current: ${combatVehicleCount}/${maxCombatVehicles}`);
    }
  }

  // Narrative-flexible unit and force-org limits.
  // These are NOT hard-enforced; they only mark the list as illegal.

  const deaconCount = units.filter(isGruntDeaconForValidation).length;
  pushMaxIssue(issues, "Deacons", deaconCount, 1, "per army");

  const knightCommanderCount = units.filter(isKnightCommanderForValidation).length;
  pushMaxIssue(issues, "Knight Commanders", knightCommanderCount, 1, "per army");

  if (platoonCommanderCount > 0) {
    const medicCount = units.filter(isMedicSlotForValidation).length;
    pushMaxIssue(issues, "Medics", medicCount, platoonCommanderCount, "per Platoon Commander");

    const observerCount = units.filter(isObserverSlotForValidation).length;
    pushMaxIssue(issues, "Forward Observers / Watchers", observerCount, platoonCommanderCount, "per Platoon Commander");

    const spiritualHQCount = units.filter(isSpiritualHQSlotForValidation).length;
    pushMaxIssue(issues, "Chaplains / Bloodhandlers", spiritualHQCount, platoonCommanderCount, "per Platoon Commander");
  }

  const companyCommanderCount = units.filter(isCompanyCommanderForValidation).length;
  pushMaxIssue(issues, "Company Commanders", companyCommanderCount, 1, "per army");

  addLimitedRuleValidation(issues, units, platoonCommanderCount);

  return {
    valid: issues.length === 0,
    issues,
    ok,
    platoonCommanders,
    infantryUnits,
    transports,
    riflePlatoonUnits,
    combatVehicles,
    commandVehicles
  };
}

function renderSummaryBlock() {
  const block = document.getElementById("summaryBlock");
  if (!block) return;

  let html = "";

	if (window.currentFaction === "UNSC") {
	  html += `<div><b>Faction:</b> ${getEffectiveArmyName()}</div>`;
	}

	if (window.currentFaction === "Covenant") {
	  if (isSwordsArmy()) {
		html += `<div><b>Faction:</b> Swords of Sanghelios</div>`;
	  } else {
		html += `<div><b>Faction:</b> Covenant</div>`;
		html += `<div><b>Caste System:</b> ${window.selectedArmyBonus || "None"}</div>`;
	  }
	}

    if (!isSimplifiedValidationEnabled()) {
    block.innerHTML = html;
    return;
  }

  const validation = getArmyValidation();

  html += `<div style="margin-top:16px;"><b>List Validation (Simplified):</b></div>`;

  validation.issues.forEach(issue => {
    html += `<div style="margin-top:6px;color:#ff9a9a;">❌ ${issue}</div>`;
  });

  validation.ok.forEach(msg => {
    html += `<div style="margin-top:6px;color:#7affb7;">✅ ${msg}</div>`;
  });

  if (validation.valid) {
    html += `<div style="margin-top:10px;color:#7affb7;font-weight:700;">List structure looks legal.</div>`;
  }

  block.innerHTML = html;
}

function getCovenantGruntTemplate() {
  return (window.UNIT_LISTS?.Covenant || []).find(
    u => u.name === "Grunt Squad" && u.type === "Infantry"
  ) || null;
}

function buildFreeCannonFodderUnit() {
  const grunt = getCovenantGruntTemplate();
  if (!grunt) return null;

  const freeUnit = {
    name: grunt.name,
    type: grunt.type,
    veterancy: "Inexperienced",
    men: grunt.baseMen || 5,
    damageValue: grunt.damageValue || "",
    transportCapacity: grunt.transportCapacity ?? undefined,
    weapons: Array.isArray(grunt.weapons) ? grunt.weapons.map(w => ({ ...w })) : [],
    squadUpgrades: {},
    weaponReplacements: {},
    ncoReplacement: grunt.options?.ncoReplacement?.options?.[0] || undefined,
    doctrine: undefined,
    extraDoctrineUpgrades: {},
    special: Array.isArray(grunt.specialRules) ? [...grunt.specialRules] : [],
    forcedCommandVehicle: false,
    cost: 0,
    lockedByArmyBonus: true,
    armyBonusSource: "Cannon Fodder"
  };

  freeUnit.weaponsTable = buildWeaponsTable(freeUnit);
  return freeUnit;
}

function syncArmyBonusEffects() {
  window.armyList = (window.armyList || []).filter(unit => !unit.lockedByArmyBonus);

  // Remove Grunt Cannon Fodder Mobs if Cannon Fodder is not selected
  if (window.currentFaction === "Covenant" && window.selectedArmyBonus !== "Cannon Fodder") {
    window.armyList = (window.armyList || []).filter(unit => unit.name !== "Grunt Cannon Fodder Mob");
  }

	// If Cannon Fodder is selected, add the free locked Grunt unit.
	// Do not delete extra Grunt Cannon Fodder Mobs here;
	// validation will mark excess mobs as illegal instead.
	if (window.currentFaction === "Covenant" && window.selectedArmyBonus === "Cannon Fodder") {
	  const freeUnit = buildFreeCannonFodderUnit();
	  if (freeUnit) window.armyList.unshift(freeUnit);
	}
}

function onArmyBonusChange() {
  const beforeArmy = getEffectiveArmyName();

  const sel = document.getElementById("armyBonusSelect");
  window.selectedArmyBonus = sel ? sel.value : "";

  const afterArmy = getEffectiveArmyName();

  // If switching between base army and alternate army, clear the list.
  // This avoids illegal old units/upgrades staying in the list.
  if (beforeArmy !== afterArmy) {
    window.armyList = [];
  }

  syncArmyBonusEffects();
  populateUnitSelect();
  renderArmyList();
}

// Add Doctrine Special Rules to unit for display/export (helper function)
function addDoctrineSpecialRules(unit) {
  if (!window.currentFaction || !unit) return;

  let triggerRule, doctrineSet, doctrineName;

  if (window.currentFaction === "UNSC") {
    triggerRule = "For Humanity’s Survival!";
    doctrineSet = UNSC_DOCTRINES;
    doctrineName = unit.doctrine;
  } else if (window.currentFaction === "Covenant") {
    triggerRule = "For The Great Journey!";
    doctrineSet = COVENANT_DOCTRINES;
    doctrineName = unit.doctrine;
  } else if (window.currentFaction === "Banished") {
    triggerRule = "Forged In Chains";
    doctrineSet = BANISHED_DOCTRINES;
    doctrineName = unit.doctrine;
  } else {
    return;
  }

  if (!Array.isArray(unit.special)) unit.special = [];

  // Remove any existing triggerRule or Doctrine lines (cleanup!)
  unit.special = unit.special.filter(r => typeof r !== "string" || (
    r !== triggerRule &&
    !r.startsWith(triggerRule + " [") &&
    !r.startsWith("Doctrine [") &&
    !r.startsWith(`${window.currentFaction} Doctrine [`)
  ));

  // If a doctrine is chosen, inject only the bracketed rule and doctrine rules
  if (doctrineName && doctrineSet && doctrineSet[doctrineName]) {
    const doctrine = doctrineSet[doctrineName];
    const doctrineLabel = `${triggerRule} [${doctrine.label}]`;
    unit.special.unshift(doctrineLabel);

    // Add doctrine special rules (no duplicates)
    (doctrine.specialRules || []).forEach(rule => {
      if (rule && !unit.special.includes(rule)) unit.special.push(rule);
    });
  } else {
    // If NO doctrine, show the faction default label
    const defaultLabel = doctrineSet?._defaultLabel;
    unit.special.unshift(defaultLabel ? `${triggerRule} [${defaultLabel}]` : triggerRule);
  }
}

// ──────────────────────────────────────────────────────────────
// helper: work out the damage value that should be shown
// ──────────────────────────────────────────────────────────────
function getDisplayDamage(unit) {
  // vehicles & walkers already carry their own damageValue field
  if (unit && unit.damageValue) return unit.damageValue;

  // infantry + teams: derive it from veterancy / Resilient
  if (unit && (unit.type === "Infantry" || unit.type === "Team")) {
    const specials = Array.isArray(unit.special)
      ? unit.special
      : unit.special
      ? [unit.special]
      : [];

    // accept either a raw string or an object { name, description }
    const hasResilient = specials.some(s =>
      typeof s === "string"
        ? s.includes("Resilient")
        : s?.name === "Resilient"
    );
    if (hasResilient) return "6+";

    switch (unit.veterancy) {
      case "Inexperienced":
        return "3+";
      case "Veteran":
        return "5+";
      default:
        return "4+";
    }
  }

  return "";
}


// GLOBAL HELPER: Robust base weapon name extractor
function getBaseWeaponName(label) {
  if (!label) return "";

  let s = String(label).trim();

  // 1) strip leading quantity (e.g. "2x", "4x")
  s = s.replace(/^\s*\d+\s*x?\s*/i, "");

  // 2) normalize punctuation / unicode
  s = s.replace(/[“”]/g, '"').replace(/[’]/g, "'");

  // 3) remove common mounting/prefix phrases using regex on the FULL string
  const prefixPatterns = [
    /\bcasement[- ]mounted\b/ig,
    /\bforward[- ]facing\b/ig,
    /\bhull[- ]mounted\b/ig,
    /\bturret[- ]mounted\b/ig,
    /\bpintle[- ]mounted\b/ig,
    /\bsponson[- ]mounted\b/ig,
    /\bco[- ]axial\b/ig,
    /\bcoaxial\b/ig,
    /\bquad[- ]linked\b/ig,
    /\btriple[- ]linked\b/ig,
    /\btwin[- ]linked\b/ig,
    /\bdual[- ]?\b/ig,
    /\brear[- ]?\b/ig,
    /\bside[- ]mounted\b/ig,
    /\bmounted\b/ig,
	/\bpaired\b/ig,
    /\bcovering\b/ig,
    /\bfront arc\b/ig,
    /\bleft arc\b/ig,
    /\bright arc\b/ig,
    /\brear arc\b/ig,
    /\b360°\s*arc\s*of\s*fire\b/ig,
  ];
  prefixPatterns.forEach(r => { s = s.replace(r, " "); });

  // 4) normalize whitespace + plural “cannons”
  s = s.replace(/\bcannons\b/ig, "cannon");
  s = s.replace(/\s+/g, " ").trim();

  // 5) Try exact key match (case-sensitive keys, so try both)
  if (allWeaponProfiles[s]) return s;

  // 6) Try longest span match (up to 6 words now that we cleaned better)
  const words = s.split(" ").filter(Boolean);
  for (let span = Math.min(words.length, 6); span >= 1; span--) {
    for (let i = 0; i <= words.length - span; i++) {
      let tryStr = words.slice(i, i + span).join(" ");
      if (allWeaponProfiles[tryStr]) return tryStr;

      // trailing plural fix
      if (tryStr.endsWith("s") && allWeaponProfiles[tryStr.slice(0, -1)]) return tryStr.slice(0, -1);
    }
  }

  // 7) Fuzzy (case-insensitive) both directions
  const lower = s.toLowerCase();
  for (const key of Object.keys(allWeaponProfiles)) {
    const k = key.toLowerCase();
    if (k.includes(lower) || lower.includes(k)) return key;
  }

  return s;
}

function getRuleName(rule) {
  if (!rule) return "";
  if (typeof rule === "string") return rule.split(":")[0].trim();
  return rule.name || "";
}

function hasRule(unit, unitData, ruleName) {
  const rules = [
    ...(Array.isArray(unitData?.specialRules) ? unitData.specialRules : []),
    ...(Array.isArray(unit?.special) ? unit.special : [])
  ];

  return rules.some(r => getRuleName(r) === ruleName);
}

function hasNonOfficerOrNcoModel(unit, unitData) {
  const men = Number(unit?.men ?? unitData?.baseMen ?? 0);
  const name = String(unit?.name || "");

  // These profiles are leader-style units where 1 model means only the Officer/NCO/leader exists.
  const isLeaderProfile =
    /Officer|Forward Observer|Chaplain|Bloodhandler|Attached Leader/i.test(name);

  // Normal squads have an NCO plus other models if they have more than 1 model.
  // Leader profiles also need more than 1 model to have a non-Officer/non-NCO bodyguard.
  return men > 1;
}

function isSpartan(unit, unitData) {
  const name = String(unit?.name || "").toLowerCase();

  return (
    unit?.doctrine === "Spartan" ||
    name.includes("spartan")
  );
}

function isElite(unit, unitData) {
  const name = String(unit?.name || "").toLowerCase();

  return (
    unit?.doctrine === "Elite" ||
    name.includes("elite") ||
    name.includes("honor guard") ||
    name.includes("honour guard")
  );
}

function isBrute(unit, unitData) {
  const name = String(unit?.name || "")
    .toLowerCase()
    .replace(/[’‘]/g, "'");

  return (
    unit?.doctrine === "Brute" ||
    name.includes("brute") ||
    name.includes("atriox")
  );
}

function isMarineODSTOrSpartan(unit, unitData) {
  const doctrine = String(unit?.doctrine || "");
  const name = String(unit?.name || "").toLowerCase();

  return (
    ["Marine", "ODST", "Spartan"].includes(doctrine) ||
    name.includes("marine") ||
    name.includes("odst") ||
    name.includes("spartan")
  );
}

function isArmouredVehicle(unitData) {
  const match = String(unitData?.damageValue || "").match(/(\d+)\+/);
  return !!(match && Number(match[1]) >= 7);
}

function cloneUnitData(data) {
  return JSON.parse(JSON.stringify(data));
}

function armyHasSquadUpgrade(label, exceptUnit = null) {
  return (window.armyList || []).some(u =>
    u !== exceptUnit &&
    u?.squadUpgrades?.[label]
  );
}

function removeSpecialRuleByName(unit, ruleName) {
  if (!unit || !Array.isArray(unit.special)) return;

  unit.special = unit.special.filter(rule => getRuleName(rule) !== ruleName);
}

function getSquadUpgradeCostForUnit(unit, label) {
  const unitData = getUnitData(unit);
  const upgrade = unitData?.options?.squadUpgrades?.[label];

  if (!upgrade) {
    // Fallback for known armoury upgrades in older saved lists.
    if (label === "Sacred Relic") return 15;
    return 0;
  }

  if (upgrade.perModel === false) {
    return Number(upgrade.cost) || 0;
  }

  return (Number(upgrade.cost) || 0) * (Number(unit?.men) || 0);
}

function enforceOnePerArmySquadUpgrade(label) {
  let alreadyFound = false;

  (window.armyList || []).forEach(unit => {
    if (!unit?.squadUpgrades?.[label]) return;

    if (!alreadyFound) {
      alreadyFound = true;
      return;
    }

    const costToRemove = getSquadUpgradeCostForUnit(unit, label);

    unit.squadUpgrades[label] = false;
    unit.cost = Math.max(0, (Number(unit.cost) || 0) - costToRemove);

    removeSpecialRuleByName(unit, label);
  });
}

function getArmourySquadUpgradeDefsByLabel() {
  const map = {};

  Object.values(ARMOURY_DEFS || {}).forEach(defs => {
    (defs || []).forEach(def => {
      if (
        def &&
        def.label &&
        ["ruleCheckbox", "weaponProfileSwap"].includes(def.type)
      ) {
        map[def.label] = def;
      }
    });
  });

  return map;
}

function purgeIllegalArmourySquadUpgrades(unit, unitData = getUnitData(unit)) {
  if (!unit?.squadUpgrades) return;

  const armouryDefsByLabel = getArmourySquadUpgradeDefsByLabel();
  const legalSquadUpgrades = unitData?.options?.squadUpgrades || {};

  Object.keys(unit.squadUpgrades).forEach(label => {
    // Only auto-purge armoury-generated upgrades.
    // Do not delete normal unit upgrades like Anti-Tank Grenades.
    if (!armouryDefsByLabel[label]) return;

    const isLegalNow = !!legalSquadUpgrades[label];

    if (!isLegalNow) {
      delete unit.squadUpgrades[label];

      const def = armouryDefsByLabel[label];
      const grantedRules = def.grantsRules || [];

      // Also remove the lingering displayed special rule.
      if (Array.isArray(unit.special) && grantedRules.length) {
        unit.special = unit.special.filter(r => {
          const ruleName = getRuleName(r);
          return !grantedRules.includes(ruleName);
        });
      }
    }
  });
}

function syncM301EditorLegality(unit, unitData) {
  if (!unit || !unitData) return;

  const currentMen = getEditorTotalMen(unit, unitData);
  const m301Limit = getM301Max({ ...unit, men: currentMen });

  // NCO / Officer selector: disable M301 package if unit has fewer than 4 models.
  const ncoSelect = document.getElementById("editNcoReplacement");
  if (ncoSelect) {
    Array.from(ncoSelect.options).forEach(opt => {
      if (isM301ComboWeapon(opt.value)) {
        opt.disabled = m301Limit < 1;
      }
    });

    if (m301Limit < 1 && isM301ComboWeapon(ncoSelect.value)) {
      const fallback = getM301CarrierWeapon(ncoSelect.value);
      const hasFallback = Array.from(ncoSelect.options).some(o => o.value === fallback);

      ncoSelect.value =
        hasFallback
          ? fallback
          : (unitData.options?.ncoReplacement?.options?.[0] || "");
    }
  }

  // Trooper M301 package counters: force to 0 if unit has fewer than 4 models.
  document.querySelectorAll(".editWeaponReplacement").forEach(input => {
    if (!isM301ReplacementLabel(input.dataset.label)) return;

    if (m301Limit < 1) {
      input.value = 0;
      input.disabled = true;
    } else {
      input.disabled = false;
    }
  });
}

function purgeIllegalM301Selections(unit) {
  if (!unit) return;

  const limit = getM301Max(unit);
  let used = 0;

  // NCO / Officer M301 package.
  if (isM301ComboWeapon(unit.ncoReplacement)) {
    if (used < limit) {
      used += 1;
    } else {
      unit.ncoReplacement = getM301CarrierWeapon(unit.ncoReplacement);
    }
  }

  // Trooper M301 packages.
  if (unit.weaponReplacements) {
    Object.keys(unit.weaponReplacements).forEach(label => {
      if (!isM301ReplacementLabel(label)) return;

      const allowed = Math.max(0, limit - used);
      const current = Number(unit.weaponReplacements[label]) || 0;
      const kept = Math.min(current, allowed);

      unit.weaponReplacements[label] = kept;
      used += kept;
    });
  }
}

const COST_DISPLAY_VETERANCIES = ["Inexperienced", "Regular", "Veteran"];

function getBaseCostDisplay(unit) {
  if (!unit || !unit.costs) return "";

  const costs = COST_DISPLAY_VETERANCIES.map(vet => {
    const allowed = Array.isArray(unit.allowedVeterancy)
      ? unit.allowedVeterancy.includes(vet)
      : unit.costs[vet] !== undefined;

    if (!allowed || unit.costs[vet] === undefined) return "—";

    return unit.costs[vet];
  });

  return `(${costs.join("/") } pts)`;
}

// --- AUTO-INJECT DOCTRINE OPTION BLOCK TO ALL ELIGIBLE UNITS ---
function injectDoctrineOptions(units, doctrineSet, triggerRule) {
  (units || []).forEach(unit => {
    if (Array.isArray(unit.specialRules) && unit.specialRules.includes(triggerRule)) {
      // Already has doctrine block? (Don't overwrite)
      if (unit.options && unit.options.doctrine) return;

      // If no options, create
      if (!unit.options) unit.options = {};

      // Build list of choices matching allowed veterancy for this unit
      const allowedVets = Array.isArray(unit.allowedVeterancy) ? unit.allowedVeterancy : [];
      const choices = Object.values(doctrineSet || {})
        .filter(doc => Array.isArray(doc.allowedVeterancy) && doc.allowedVeterancy.some(v => allowedVets.includes(v)))
		.map(doc => ({
		  name: doc.label,
		  costPerModel: doc.baseCostPerModel,
		  allowedVeterancy: (doc.allowedVeterancy || []).slice(),
		  specialRules: (doc.specialRules || []).slice(),
		  extraUpgrades: (doc.upgrades && doc.upgrades.length) ? doc.upgrades.slice() : []
		}))

      if (choices.length) {
        unit.options.doctrine = {
          label: "Doctrine",
          defaultLabel: doctrineSet._defaultLabel || "Default",
          choices
        };
      }
    }
  });
}

function getLeaderMeleeUpgradeOptions(unit, unitData) {
  if (!leaderHasMeleeWeapon(unit, unitData)) return [];

  const caste = getCurrentLeaderCaste(unit, unitData);
  const discount = unitHasToughFightersSpecialRule(unit, unitData) ? 1 : 0;
  const currentWeapon = getExplicitLeaderRangedWeapon(unit, unitData);
  const currentBase = getBaseWeaponName(currentWeapon);

  const opts = [{ value: "", label: "— None —", cost: 0 }];

  if (caste === "Elite") {
    if (currentWeapon && isNoRangedWeaponLabel(currentWeapon)) {
      const cost = 6 - discount;
      opts.push({
        value: "plasmaSwordNoRanged",
        label: `Plasma Sword, no ranged weapon (${formatSignedPts(cost)})`,
        cost
      });
    } else if (currentBase === "Plasma Rifle") {
      const cost = 5 - discount;
      opts.push({
        value: "plasmaSwordPlasmaRifle",
        label: `Plasma Rifle + Plasma Sword (${formatSignedPts(cost)})`,
        cost
      });
    } else if (currentBase === "Needler") {
      const cost = 5 - discount;
      opts.push({
        value: "plasmaSwordNeedler",
        label: `Needler + Plasma Sword (${formatSignedPts(cost)})`,
        cost
      });
    } else if (!currentWeapon) {
      if (leaderCanChooseWeapon(unitData, "Plasma Rifle")) {
        const cost = 5 - discount;
        opts.push({
          value: "plasmaSwordPlasmaRifle",
          label: `Plasma Rifle + Plasma Sword (${formatSignedPts(cost)})`,
          cost
        });
      }

      if (leaderCanChooseWeapon(unitData, "Needler")) {
        const cost = 5 - discount;
        opts.push({
          value: "plasmaSwordNeedler",
          label: `Needler + Plasma Sword (${formatSignedPts(cost)})`,
          cost
        });
      }
    }
  }

  if (caste === "Brute") {
    if (currentWeapon && isNoRangedWeaponLabel(currentWeapon)) {
      const cost = 8 - discount;
      opts.push({
        value: "gravityHammerNoRanged",
        label: `Gravity Hammer, no ranged weapon (${formatSignedPts(cost)})`,
        cost
      });
    } else if (currentBase === "Spiker" || currentBase === "Plasma Rifle") {
      const cost = 0 - discount;
      opts.push({
        value: "gravityHammerReplaceRanged",
        label: `Replace ${currentBase} with Gravity Hammer (${formatSignedPts(cost)})`,
        cost
      });
    } else if (!currentWeapon) {
      if (leaderCanChooseWeapon(unitData, "Spiker") || leaderCanChooseWeapon(unitData, "Plasma Rifle")) {
        const cost = 0 - discount;
        opts.push({
          value: "gravityHammerReplaceRanged",
          label: `Replace Spiker/Plasma Rifle with Gravity Hammer (${formatSignedPts(cost)})`,
          cost
        });
      }
    }
  }

  return opts;
}

function getLeaderMeleeUpgradeCost(unit, unitData) {
  if (unitData?.options?.ncoReplacement) return 0;

  const value = document.getElementById("editLeaderMeleeUpgrade")?.value || unit?.leaderMeleeUpgrade || "";
  if (!value) return 0;

  const opt = getLeaderMeleeUpgradeOptions(unit, unitData).find(o => o.value === value);
  return opt ? Number(opt.cost) || 0 : 0;
}

function getAllowedDoctrineChoicesForUnit(unit, unitData) {
  const allChoices = unitData?.options?.doctrine?.choices || [];
  const vet = unit?.veterancy;

  return allChoices.filter(choice => {
    if (isInsurrectionArmy() && choice.name === "Spartan") return false;
    if (isSwordsArmy() && choice.name === "Brute") return false;

    if (!Array.isArray(choice.allowedVeterancy) || choice.allowedVeterancy.length === 0) return true;
    return choice.allowedVeterancy.includes(vet);
  });
}
