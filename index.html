// --- Parse a weapon profile string into stat fields ---
function parseWeaponProfile(profileStr) {
  if (!profileStr) return { range: "", shots: "", pen: "", special: "" };
  let match = String(profileStr).match(/Range ([^,]+), Shots ([^,]+), Pen ([^,]+), ?(.*)/);
  if (!match) return { range: "", shots: "", pen: "", special: "" };
  return {
    range: match[1].trim(),
    shots: match[2].trim(),
    pen: match[3].trim(),
    special: match[4] ? match[4].trim() : ""
  };
}

function adjustVehicleMountedMGShots(label, prof) {
  if (!prof || !prof.shots) return prof;

  const fullLabel = String(label || "");
  const baseName = getBaseWeaponName(fullLabel);

  // Only apply to vehicle-mounted machine guns
  const machineGunNames = new Set([
    "LMG",
    "Light Machine Gun",
    "MMG",
    "Medium Machine Gun",
    "HMG",
    "Heavy Machine Gun",
    "Plasma Repeater",
    "Medium Plasma MG",
    "Heavy Plasma MG",
    "Medium Plasma Machine Gun",
    "Heavy Plasma Machine Gun"
  ]);

  if (!machineGunNames.has(baseName)) return prof;

  // Paired MGs keep full shots
  if (/\bPaired\b/i.test(fullLabel)) return prof;

  const rawShots = String(prof.shots).trim();

  // Only halve plain numeric shot values
  if (!/^\d+$/.test(rawShots)) return prof;

  return {
    ...prof,
    shots: String(Math.max(1, Math.floor(Number(rawShots) / 2)))
  };
}

function getLeaderWeaponPrefix(unit) {
  const name = String(unit?.name || "");

  if (/^Officer\b/i.test(name)) return "Officer";
  if (/Forward Observer/i.test(name)) return "Observer";
  if (/Medic/i.test(name)) return "Medic";
  if (/Chaplain/i.test(name)) return "Chaplain";
  if (/Bloodhandler/i.test(name)) return "Bloodhandler";
  if (/Watcher/i.test(name)) return "Watcher";

  return "NCO";
}

function buildWeaponsTable(unit) {
  let table = [];
  const unitData = getUnitData(unit);

  if (!unit || !unitData) return table;

  // 1. SPECIAL CASE: Sniper Teams (only these two units!)
  const isSniperTeam =
    unit.type === "Team" &&
    unit.name === "Sniper Team" &&
    Array.isArray(unitData.weapons) &&
    unitData.weapons.length === 2 &&
    unitData.baseMen === 2 &&
    unitData.maxMen === 2;

	if (isSniperTeam) {
	  const weaponsToShow = Array.isArray(unit.weapons) && unit.weapons.length
		? unit.weapons
		: unitData.weapons;

	  weaponsToShow.forEach(w => {
		let prof = parseWeaponProfile(allWeaponProfiles[getBaseWeaponName(w.name)] || "");
		table.push({
		  qty: 1,
		  label: `${w.name}`,
		  ...prof
		});
	  });

	  return table;
	}

	// 2. Choose-any infantry, including officers with optional M301 carriers
	if (isChooseAnyWeaponUnit(unit, unitData)) {
	  const totalMen = unit.men || unitData.baseMen || 1;
	  const m301Selections = getM301Selections(unit, unitData);
	  const m301Count = getM301SelectionCount(unit, unitData);
	  const genericCount = Math.max(0, totalMen - m301Count);

	  // Show M301 carriers first.
	  m301Selections.forEach(sel => {
		const baseProf = parseWeaponProfile(allWeaponProfiles[getBaseWeaponName(sel.baseWeapon)] || "");
		const m301Prof = parseWeaponProfile(allWeaponProfiles["M301 Grenade Launcher"] || "");

		const prefix = sel.role === "nco"
		  ? getLeaderWeaponPrefix(unit)
		  : (sel.count > 1 ? `${sel.count}x M301 carrier` : "M301 carrier");

		table.push({
		  qty: sel.count,
		  label: `${prefix}: ${sel.baseWeapon}`,
		  ...baseProf
		});

		table.push({
		  qty: sel.count,
		  label: `${prefix}: M301 Grenade Launcher`,
		  ...m301Prof
		});
	  });

	  // Then show the remaining models as one grouped "may choose" block.
	  if (genericCount > 0) {
		table.push({
		  qty: genericCount,
		  label: `${genericCount}x`,
		  range: "",
		  shots: "",
		  pen: "",
		  special: "",
		  chooseAnyHeader: true
		});

		unitData.weapons.forEach(w => {
		  const prof = parseWeaponProfile(allWeaponProfiles[getBaseWeaponName(w.name)] || "");

		  table.push({
			qty: genericCount,
			label: w.name,
			...prof,
			chooseAnyOption: true
		  });
		});
	  }

	  return table;
	}

  // 2b. Legacy choose-any fallback for non-M301 units.
  // This should NOT catch units whose unitData has generated weapon replacement options.
  const hasUnitDataWeaponReplacements =
    Object.keys(unitData.options?.weaponReplacements || {}).length > 0;

  const isLegacyChooseAny = (
    (unit.type === "Infantry" || unit.type === "Team") &&
    !unit.weaponReplacements &&
    !hasUnitDataWeaponReplacements &&
    Array.isArray(unitData.weapons) &&
    unitData.weapons.length > 1
  );

  if (isLegacyChooseAny) {
    const count = unit.men || unitData.baseMen || 1;

    unitData.weapons.forEach(w => {
      const prof = parseWeaponProfile(allWeaponProfiles[getBaseWeaponName(w.name)] || "");
      table.push({
        qty: count,
        label: (count > 1 ? `${count}x may choose: ` : "may choose: ") + w.name,
        ...prof
      });
    });

    return table;
  }
  // 3. INFANTRY SQUADS (multi-man, with possible weapon swaps)
  if (unit.type === "Infantry" && unit.men > 1) {
    let menLeft = unit.men - 1; // NCO is separate
    let weaponCounts = {};

    // Weapon replacements
    if (unit.weaponReplacements && unitData.options?.weaponReplacements) {
      Object.entries(unit.weaponReplacements).forEach(([upgradeLabel, cnt]) => {
        if (cnt > 0) {
          const repl = unitData.options.weaponReplacements[upgradeLabel];
          if (repl && repl.grants && repl.replaces) {
			if (isM301ComboWeapon(repl.grants)) {
			  const baseWeapon = getM301CarrierWeapon(repl.grants);

			  weaponCounts[baseWeapon] = (weaponCounts[baseWeapon] || 0) + cnt;
			  weaponCounts["M301 Grenade Launcher"] = (weaponCounts["M301 Grenade Launcher"] || 0) + cnt;
			} else {
			  weaponCounts[repl.grants] = (weaponCounts[repl.grants] || 0) + cnt;
			}

			menLeft -= cnt;
          }
        }
      });
    }

    let defaultWeapon = unitData.weapons?.[0]?.name || "Plasma Pistol";
    if (menLeft > 0) {
      weaponCounts[defaultWeapon] = (weaponCounts[defaultWeapon] || 0) + menLeft;
    }

    // Output all trooper rows
    Object.entries(weaponCounts).forEach(([weapon, count]) => {
      const baseWeapon = getBaseWeaponName(weapon);
      if (baseWeapon === "Melee Weapon" || baseWeapon === "Melee Weapons") return;

      let prof = parseWeaponProfile(allWeaponProfiles[baseWeapon] || "");
      table.push({
        qty: count,
        label: count > 1 ? `${count}x ${weapon}` : weapon,
        ...prof
      });
    });

    // NCO weapon (from unit.ncoReplacement if present, otherwise default)
    let ncoWeapon =
      unit.ncoReplacement ||
      (unitData.options?.ncoReplacement?.options?.[0] || unitData.weapons?.[0]?.name || "Plasma Pistol");

	if (isM301ComboWeapon(ncoWeapon)) {
	  const baseWeapon = getM301CarrierWeapon(ncoWeapon);

	  let baseProf = parseWeaponProfile(allWeaponProfiles[getBaseWeaponName(baseWeapon)] || "");
	  table.push({
		qty: 1,
		label: `NCO: ${baseWeapon}`,
		...baseProf
	  });

	  let m301Prof = parseWeaponProfile(allWeaponProfiles["M301 Grenade Launcher"] || "");
	  table.push({
		qty: 1,
		label: "NCO: M301 Grenade Launcher",
		...m301Prof
	  });
	} else if (isPlasmaSwordComboWeapon(ncoWeapon)) {
	  const baseWeapon = getPlasmaSwordComboRangedWeapon(ncoWeapon);

	  let baseProf = parseWeaponProfile(allWeaponProfiles[getBaseWeaponName(baseWeapon)] || "");
	  table.push({
		qty: 1,
		label: `NCO: ${baseWeapon}`,
		...baseProf
	  });

	  let swordProf = parseWeaponProfile(allWeaponProfiles["Plasma Sword"] || "");
	  table.push({
		qty: 1,
		label: "NCO: Plasma Sword",
		...swordProf
	  });
	} else {
	  const baseNcoWeapon = getBaseWeaponName(ncoWeapon);

	  if (baseNcoWeapon !== "Melee Weapon" && baseNcoWeapon !== "Melee Weapons") {
		let ncoProf = parseWeaponProfile(allWeaponProfiles[baseNcoWeapon] || "");
		table.push({
		  qty: 1,
		  label: `NCO: ${ncoWeapon}`,
		  ...ncoProf
		});
	  }
	}

    return table;
  }

// 4a. SINGLE-MODEL INFANTRY/TEAM WITH WEAPON REPLACEMENTS
if (
  (unit.type === "Infantry" || unit.type === "Team") &&
  unit.men === 1 &&
  unit.weaponReplacements &&
  unitData.options?.weaponReplacements
) {
  let addedReplacement = false;

  Object.entries(unit.weaponReplacements).forEach(([upgradeLabel, cnt]) => {
    if ((Number(cnt) || 0) <= 0) return;

    const repl = unitData.options.weaponReplacements[upgradeLabel];
    if (!repl?.grants) return;

    if (isM301ComboWeapon(repl.grants)) {
      const baseWeapon = getM301CarrierWeapon(repl.grants);

      table.push({
        qty: 1,
        label: baseWeapon,
        ...parseWeaponProfile(allWeaponProfiles[getBaseWeaponName(baseWeapon)] || "")
      });

      table.push({
        qty: 1,
        label: "M301 Grenade Launcher",
        ...parseWeaponProfile(allWeaponProfiles["M301 Grenade Launcher"] || "")
      });
    } else {
      table.push({
        qty: 1,
        label: repl.grants,
        ...parseWeaponProfile(allWeaponProfiles[getBaseWeaponName(repl.grants)] || "")
      });
    }

    addedReplacement = true;
  });

  if (addedReplacement) return table;
}

  // 4. SINGLE-MODEL INFANTRY OR TEAM (e.g., sniper, hero, FO)
  if ((unit.type === "Infantry" || unit.type === "Team") && unit.men === 1 && Array.isArray(unitData.weapons)) {
    unitData.weapons.forEach(w => {
      let prof = parseWeaponProfile(allWeaponProfiles[getBaseWeaponName(w.name)] || "");
      table.push({
        qty: 1,
        label: `${w.name}`,
        ...prof
      });
    });
    return table;
  }

  // 5. CREW-SERVED TEAMS / ARTILLERY
  if (unit.type === "Team" && Array.isArray(unit.weapons)) {
    const weaponMap = {};

    (unit.weapons || []).forEach(w => {
      const label = typeof w === "string" ? w : w?.name;
      if (!label) return;
      if (!weaponMap[label]) weaponMap[label] = { qty: 0, label };
      weaponMap[label].qty += 1;
    });

    Object.values(weaponMap).forEach(item => {
      let prof = parseWeaponProfile(allWeaponProfiles[getBaseWeaponName(item.label)] || "");

      table.push({
        ...prof,
        qty: item.qty,
        label: (item.qty > 1 ? `${item.qty}x ` : "") + item.label
      });
    });

    return table;
  }

  // 6. VEHICLES ONLY
  const isActualVehicle =
    unit.type !== "Infantry" &&
    unit.type !== "Team";

  if (isActualVehicle) {
    const weaponMap = {};
    (unit.weapons || []).forEach(w => {
      const label = typeof w === "string" ? w : w?.name;
      if (!label) return;
      if (!weaponMap[label]) weaponMap[label] = { qty: 0, label };
      weaponMap[label].qty += 1;
    });

    Object.values(weaponMap).forEach(item => {
      let prof = parseWeaponProfile(allWeaponProfiles[getBaseWeaponName(item.label)] || "");
      prof = adjustVehicleMountedMGShots(item.label, prof);

      table.push({
        ...prof,
        qty: item.qty,
        label: (item.qty > 1 ? `${item.qty}x ` : "") + item.label
      });
    });
    return table;
  }

  return table;
}

function applyArmouryWeaponProfileSwaps(unit, table) {
  if (!unit || !Array.isArray(table)) return table;

  const upgrades = unit.squadUpgrades || {};

  if (upgrades["Volatile Biomass"]) {
    return table.map(row => {
      const base = getBaseWeaponName(row.label);
      if (base !== "Explosive Biomass") return row;

      const prof = parseWeaponProfile(allWeaponProfiles["Volatile Biomass"]);
      return {
        ...row,
        label: String(row.label || "").replace("Explosive Biomass", "Volatile Biomass"),
        ...prof
      };
    });
  }

  return table;
}

function addWeaponSpecialRule(specialText, ruleName) {
  const parts = String(specialText || "")
    .split(",")
    .map(s => s.trim())
    .filter(s => s && s !== "–");

  const alreadyHasRule = parts.some(part =>
    part.replace(/\s*\(.+\)$/, "").trim() === ruleName
  );

  if (!alreadyHasRule) parts.push(ruleName);

  return parts.length ? parts.join(", ") : ruleName;
}

function applyHardLightCalibrationWeaponRules(unit, table) {
  if (!unit || !Array.isArray(table)) return table;

  if (!unit.squadUpgrades?.["Hard-Light Calibration"]) return table;

  return table.map(row => {
    const base = getBaseWeaponName(row.label);

    // Do not add it to non-ranged/melee entries.
    if (["Unarmed", "Fist", "Fists", "Melee Weapon", "Melee Weapons"].includes(base)) {
      return row;
    }

    return {
      ...row,
      special: addWeaponSpecialRule(row.special, "Cover Piercing")
    };
  });
}

function isLinkedWeaponLabel(label) {
  return /\blinked\b/i.test(String(label || ""));
}

function stripLeadingWeaponCountOnly(label) {
  return String(label || "")
    .replace(/^\s*\d+\s*x\s*/i, "")
    .replace(/\s+/g, " ")
    .trim();
}

function multiplyShotsValue(shots, multiplier) {
  const n = Number(String(shots || "").trim());
  if (!Number.isFinite(n) || n <= 0) return shots;
  return String(n * multiplier);
}

function applyLinkedWeaponBatteryAggregation(table) {
  if (!Array.isArray(table)) return table;

  return table.map(row => {
    if (!row || !isLinkedWeaponLabel(row.label)) return row;

    const qty = Number(row.qty) || 1;
    if (qty <= 1) return row;

    return {
      ...row,
      qty: 1,
      label: stripLeadingWeaponCountOnly(row.label),
      shots: multiplyShotsValue(row.shots, qty),
      special: addWeaponSpecialRule(row.special, "Linked")
    };
  });
}

const buildWeaponsTableBase = buildWeaponsTable;

function stripLeaderWeaponPrefix(label) {
  return String(label || "")
    .replace(/^(NCO|Officer|Observer|Medic|Chaplain|Bloodhandler|Watcher):\s*/i, "")
    .replace(/^\d+x\s*/i, "")
    .trim();
}

function addLeaderWeaponRow(table, unit, weaponName) {
  const prof = parseWeaponProfile(allWeaponProfiles[weaponName] || "");
  const prefix = getLeaderWeaponPrefix(unit);

  table.push({
    qty: 1,
    label: `${prefix}: ${weaponName}`,
    ...prof
  });
}

function decrementChooseAnyLeaderSlot(table) {
  table.forEach(row => {
    if (row.chooseAnyHeader || row.chooseAnyOption) {
      row.qty = Math.max(0, (Number(row.qty) || 0) - 1);

      if (row.chooseAnyHeader) {
        row.label = `${row.qty}x`;
      }
    }
  });

  return table.filter(row => {
    if ((row.chooseAnyHeader || row.chooseAnyOption) && Number(row.qty) <= 0) return false;
    return true;
  });
}

function removeLeaderRangedWeaponRow(table, unit, weaponNames) {
  const prefix = getLeaderWeaponPrefix(unit);
  const wanted = new Set(weaponNames.map(getBaseWeaponName));

  const idx = table.findIndex(row => {
    const label = String(row.label || "");
    if (!label.startsWith(prefix + ":")) return false;

    const stripped = stripLeaderWeaponPrefix(label);
    return wanted.has(getBaseWeaponName(stripped));
  });

  if (idx >= 0) {
    table.splice(idx, 1);
    return true;
  }

  return false;
}

function applyLeaderMeleeUpgradeToWeaponsTable(unit, table) {
  if (!unit || !Array.isArray(table) || !unit.leaderMeleeUpgrade) return table;

  const unitData = getUnitData(unit);
  if (!unitData) return table;
  if (unitData.options?.ncoReplacement) return table;
  if (isLeaderMeleeComboWeapon(unit?.ncoReplacement)) return table;
  if (!leaderHasMeleeWeapon(unit, unitData)) return table;

  let out = table.map(row => ({ ...row }));

  switch (unit.leaderMeleeUpgrade) {
    case "plasmaSwordNoRanged":
      addLeaderWeaponRow(out, unit, "Plasma Sword");
      break;

    case "plasmaSwordPlasmaRifle":
      if (!unitData.options?.ncoReplacement) {
        out = decrementChooseAnyLeaderSlot(out);
        addLeaderWeaponRow(out, unit, "Plasma Rifle");
      }
      addLeaderWeaponRow(out, unit, "Plasma Sword");
      break;

    case "plasmaSwordNeedler":
      if (!unitData.options?.ncoReplacement) {
        out = decrementChooseAnyLeaderSlot(out);
        addLeaderWeaponRow(out, unit, "Needler");
      }
      addLeaderWeaponRow(out, unit, "Plasma Sword");
      break;

    case "gravityHammerReplaceRanged": {
      const removed = removeLeaderRangedWeaponRow(out, unit, ["Spiker", "Plasma Rifle"]);

      if (!removed && !unitData.options?.ncoReplacement) {
        out = decrementChooseAnyLeaderSlot(out);
      }

      addLeaderWeaponRow(out, unit, "Gravity Hammer");
      break;
    }

    case "gravityHammerNoRanged":
      addLeaderWeaponRow(out, unit, "Gravity Hammer");
      break;
  }

  return out;
}

function applyM808BScorpionImprovedHE(unit, table) {
  if (!unit || !Array.isArray(table) || unit.name !== "M808B Scorpion") return table;

  return table.map(row => {
    const label = String(row.label || "");
    const base = getBaseWeaponName(label);

    const isMainGun =
      base === "Medium Anti-Tank Weapon" ||
      /\bMedium Anti-Tank Weapon\b/i.test(label);

    if (!isMainGun) return row;

    let special = String(row.special || "");

    if (/HE\s*\(1"\)/i.test(special)) {
      special = special.replace(/HE\s*\(1"\)/gi, 'HE (2")');
    } else if (!/HE\s*\(2"\)/i.test(special)) {
      special = special ? `${special}, HE (2")` : 'HE (2")';
    }

    return {
      ...row,
      special
    };
  });
}

buildWeaponsTable = function(unit) {
  let table = buildWeaponsTableBase(unit);
  table = applyArmouryWeaponProfileSwaps(unit, table);
  table = applyHardLightCalibrationWeaponRules(unit, table);
  table = applyLeaderMeleeUpgradeToWeaponsTable(unit, table);
  table = applyM808BScorpionImprovedHE(unit, table);
  table = applyLinkedWeaponBatteryAggregation(table);
  return table;
};

function canForceCommandVehicle(unit, unitData) {
  if (!unit || !unitData) return false;

  // Only vehicles.
  if (unit.type === "Infantry" || unit.type === "Team" || unit.type === "Artillery") return false;

  // Transport-category vehicles cannot be Command Vehicles in this ruleset.
  const slot = String(unit?.forceOrgSlot || unitData?.forceOrgSlot || "").toLowerCase();
  if (slot === "transport") return false;

  // Aircraft may not be forced Command Vehicles.
  if (unit.type === "Aircraft") return false;

  const hasBuiltIn = Array.isArray(unitData.specialRules) &&
    unitData.specialRules.some(r => getRuleName(r) === "Command Vehicle");

  const canBuyNormally = !!unitData.options?.weaponUpgrades?.["Command Vehicle"];

  return !hasBuiltIn && !canBuyNormally;
}

// Always use the table that already knows the real quantities
function getFinalWeaponsList(unit) {
  return buildWeaponsTable(unit);
}


// GLOBAL: Lookup reference unit data by name/type and type
function getUnitData(unit) {
  if (!unit || !window.currentFaction) return null;

  let rawUnitData = null;

  // --- Special case: Flood borrowed vehicle (Corrupted Arsenal) ---
  if (window.currentFaction === "Flood" && unit.isFloodBorrowed && unit.sourceFaction) {
    const sourceUnits = window.UNIT_LISTS?.[unit.sourceFaction] || [];
    const sourceVehicles = window.VEHICLE_LISTS?.[unit.sourceFaction] || [];
    const sourceList = sourceUnits.concat(sourceVehicles);

    const baseName = String(unit.originalName || unit.name || "")
      .replace(/\s+\[Corrupted Arsenal(?: - .*?)?\]$/, "");

    rawUnitData = sourceList.find(u => u.name === baseName && u.type === unit.type) || null;

    // IMPORTANT:
    // Flood borrowed units use source unit data, but armoury upgrades are still checked
    // against window.currentFaction, so Banished/UNSC/Covenant/Forerunner armoury
    // will not appear in Flood armies.
    return injectLeaderMeleeNcoOptions(
  unit,
  injectM301Options(unit, applyArmouryToUnitData(unit, rawUnitData))
);
  }

  // --- Normal behavior ---
  const units = window.UNIT_LISTS?.[window.currentFaction] || [];
  const vehicles = window.VEHICLE_LISTS?.[window.currentFaction] || [];
  const list = units.concat(vehicles);

  rawUnitData = list.find(u => u.name === unit.name && u.type === unit.type) || null;

return injectLeaderMeleeNcoOptions(
  unit,
  injectM301Options(unit, applyArmouryToUnitData(unit, rawUnitData))
);
}

function unitHasDoctrine(unitData) {
  const s = Array.isArray(unitData?.specialRules) ? unitData.specialRules : [];
  return (
    s.includes("For Humanity’s Survival!") ||
    s.includes("For The Great Journey!") ||
    s.includes("Forged In Chains")
  );
}

function getUnitDisplaySpecialRules(unit, unitData) {
  let displayRules = [];
  const specials = Array.isArray(unitData?.specialRules) ? unitData.specialRules : [];

  // 1) Add doctrine rules if a doctrine is selected
  const doctrines =
    specials.includes("For Humanity’s Survival!") ? UNSC_DOCTRINES :
    specials.includes("For The Great Journey!")   ? COVENANT_DOCTRINES :
    specials.includes("Forged In Chains")         ? BANISHED_DOCTRINES :
    null;

  if (doctrines && unit.doctrine) {
    const doc = doctrines[unit.doctrine];
    if (doc) {
      if (doc.label) displayRules.push(`[${doc.label} Doctrine]`);
      (doc.specialRules || []).forEach(r => {
        if (r && !displayRules.includes(r)) displayRules.push(r);
      });
    }
  }

  // 2) Add static rules, skipping doctrine triggers
  specials.forEach(rule => {
    if (
      rule !== "For Humanity’s Survival!" &&
      rule !== "For The Great Journey!" &&
      rule !== "Forged In Chains" &&
      !displayRules.includes(rule)
    ) {
      displayRules.push(rule);
    }
  });

  // 3) Add rules from selected doctrine upgrades (and handle replacesRule)
  if (doctrines && unit.doctrine && unit.extraDoctrineUpgrades) {
    const doc = doctrines[unit.doctrine];
    if (doc && Array.isArray(doc.upgrades)) {
      doc.upgrades.forEach(upg => {
        if (!unit.extraDoctrineUpgrades[upg.name]) return;

        if (upg.replacesRule) {
          displayRules = displayRules.filter(r => r !== upg.replacesRule);
        }
        if (upg.grantsRule) {
          const add = r => { if (r && !displayRules.includes(r)) displayRules.push(r); };
          Array.isArray(upg.grantsRule) ? upg.grantsRule.forEach(add) : add(upg.grantsRule);
        }
      });
    }
  }

  return displayRules;
}


////////////////////////////////////////////////////////////////////////////////
// 6. LIVE COST PREVIEW & COST CALCULATION
////////////////////////////////////////////////////////////////////////////////

function sanitizeVehicleUpgradeSelection(selectedSet, upgradesDef, maxWeaponUpgrades = Infinity) {
  const result = [];
  const usedSlots = new Set();
  const max = Number.isFinite(Number(maxWeaponUpgrades)) ? Number(maxWeaponUpgrades) : Infinity;

  selectedSet.forEach(label => {
    const upg = upgradesDef?.[label];
    if (!upg) return;

    const slot = upg.slot || null;

    if (slot && usedSlots.has(slot)) return;
    if (result.length >= max) return;

    result.push(label);
    if (slot) usedSlots.add(slot);
  });

  return new Set(result);
}

// ── GLOBAL helper ── (single definition; previous duplicate removed)
function addRequired(label, allUpgrades, upgradesDef) {
  const upg = upgradesDef?.[label];
  if (!upg || !upg.requires) return;

  const add = dep => {
    if (!dep) return;
    if (!allUpgrades.has(dep)) {
      allUpgrades.add(dep);
      addRequired(dep, allUpgrades, upgradesDef); // recurse
    }
  };

  Array.isArray(upg.requires) ? upg.requires.forEach(add) : add(upg.requires);
}

function getEditorBaseMen(unit, unitData) {
  if (!unit || !unitData) return 0;
  if (unit.type === "Team") return unitData.baseMen || 0;

  const input = document.getElementById("editMenInput");
  const raw = input ? parseInt(input.value, 10) : unit.men;
  const minMen = unitData.baseMen || 0;
  const maxMen = unitData.maxMen ?? minMen;
  const fallback = unit.men || minMen;

  const value = isNaN(raw) ? fallback : raw;
  return Math.max(minMen, Math.min(maxMen, value));
}

function getEditorBonusMen(unitData) {
  let bonusMen = 0;
  document.querySelectorAll(".editSquadUpgrade:checked").forEach(cb => {
    const upg = unitData?.options?.squadUpgrades?.[cb.dataset.upgrade];
    if (upg?.addMan) bonusMen += upg.addMan;
  });
  return bonusMen;
}

function getSavedBonusMen(unit, unitData) {
  let bonusMen = 0;
  if (!unit?.squadUpgrades || !unitData?.options?.squadUpgrades) return 0;

  Object.entries(unit.squadUpgrades).forEach(([label, picked]) => {
    if (!picked) return;
    const upgrade = unitData.options.squadUpgrades[label];
    if (upgrade?.addMan) bonusMen += upgrade.addMan;
  });

  return bonusMen;
}

function getEditorDisplayedBaseMen(unit, unitData) {
  const minMen = unitData?.baseMen || 0;
  const maxMen = unitData?.maxMen ?? minMen;
  const totalMen = unit?.men ?? minMen;
  const savedBonusMen = getSavedBonusMen(unit, unitData);

  return Math.max(minMen, Math.min(maxMen, totalMen - savedBonusMen));
}

function getEditorTotalMen(unit, unitData) {
  return getEditorBaseMen(unit, unitData) + getEditorBonusMen(unitData);
}

function getSelectedNcoWeapon(unit, unitData) {
  const select = document.getElementById("editNcoReplacement");
  if (select) return select.value;

  return unit?.ncoReplacement ||
    unitData?.options?.ncoReplacement?.options?.[0] ||
    unitData?.weapons?.[0]?.name ||
    null;
}

function getCleanRuleName(rule) {
  if (!rule) return "";
  if (typeof getRuleName === "function") return getRuleName(rule);
  if (typeof rule === "string") return rule;
  if (typeof rule === "object" && rule.name) return rule.name;
  return "";
}

function ruleListHasRule(rules, ruleName) {
  return (rules || []).some(r => getCleanRuleName(r) === ruleName);
}

function unitHasToughFightersSpecialRule(unit, unitData) {
  const rules = [
    ...(Array.isArray(unitData?.specialRules) ? unitData.specialRules : []),
    ...(Array.isArray(unit?.special) ? unit.special : [])
  ];

  return ruleListHasRule(rules, "Tough Fighters");
}

function upgradeGrantsMeleeWeapon(upgrade) {
  if (!upgrade) return false;

  const grants = [];

  if (upgrade.grantsRule) {
    Array.isArray(upgrade.grantsRule)
      ? grants.push(...upgrade.grantsRule)
      : grants.push(upgrade.grantsRule);
  }

  if (Array.isArray(upgrade.grantsRules)) {
    grants.push(...upgrade.grantsRules);
  }

  return grants.some(r => {
    const name = getCleanRuleName(r);
    return name === "Melee Weapon" || name === "Melee Weapons";
  });
}

function getCurrentLeaderCaste(unit, unitData) {
  const doctrine = String(unit?.doctrine || "");
  const name = String(unit?.name || "").toLowerCase();

  if (doctrine === "Elite") return "Elite";
  if (doctrine === "Brute") return "Brute";

  // If the unit has a doctrine selector but no doctrine is currently chosen,
  // do not guess from helper functions or stale DOM.
  if (unitData?.options?.doctrine) return "";

  if (typeof isElite === "function" && isElite(unit, unitData)) return "Elite";
  if (typeof isBrute === "function" && isBrute(unit, unitData)) return "Brute";

  if (name.includes("elite") || name.includes("honor guard") || name.includes("honour guard")) return "Elite";
  if (name.includes("brute") || name.includes("atriox")) return "Brute";

  return "";
}

function leaderHasMeleeWeapon(unit, unitData) {
  if (!unit || !unitData) return false;
  if (unit.type !== "Infantry") return false;

  const baseRules = [
    ...(Array.isArray(unitData?.specialRules) ? unitData.specialRules : []),
    ...(Array.isArray(unit?.special) ? unit.special : [])
  ];

  if (
    ruleListHasRule(baseRules, "Melee Weapon") ||
    ruleListHasRule(baseRules, "Melee Weapons")
  ) {
    return true;
  }

  if (unitData?.options?.squadUpgrades) {
    for (const [label, upgrade] of Object.entries(unitData.options.squadUpgrades)) {
      const cb = document.querySelector(`.editSquadUpgrade[data-upgrade="${label}"]`);
      const picked = cb ? cb.checked : !!unit?.squadUpgrades?.[label];

      if (picked && upgradeGrantsMeleeWeapon(upgrade)) return true;
    }
  }

  const doctrineName = document.getElementById("editDoctrineSelect")?.value || unit?.doctrine || "";
  const doctrineSpec = getAllowedDoctrineChoicesForUnit(unit, unitData).find(dc => dc.name === doctrineName);

  if (doctrineSpec?.extraUpgrades) {
    for (const upgrade of doctrineSpec.extraUpgrades) {
      const cb = document.querySelector(`.editDoctrineExtraUpgrade[data-upgrade="${upgrade.name}"]`);
      const picked = cb ? cb.checked : !!unit?.extraDoctrineUpgrades?.[upgrade.name];

      if (picked && upgradeGrantsMeleeWeapon(upgrade)) return true;
    }
  }

  return false;
}

function isNoRangedWeaponLabel(label) {
  const text = String(label || "");
  const base = getBaseWeaponName(text);

  return (
    base === "Unarmed" ||
    /melee weapon/i.test(text)
  );
}

function getExplicitLeaderRangedWeapon(unit, unitData) {
  if (unitData?.options?.ncoReplacement) {
    return getSelectedNcoWeapon(unit, unitData);
  }

  if (Array.isArray(unitData?.weapons) && unitData.weapons.length === 1) {
    return unitData.weapons[0].name;
  }

  return null;
}

function leaderCanChooseWeapon(unitData, weaponName) {
  const check = w => getBaseWeaponName(w) === weaponName;

  if ((unitData?.weapons || []).some(w => check(w.name))) return true;
  if ((unitData?.options?.ncoReplacement?.options || []).some(opt => check(opt))) return true;

  return false;
}

function formatSignedPts(value) {
  const n = Number(value) || 0;
  if (n === 0) return "0pts";
  return `${n > 0 ? "+" : ""}${n}pts`;
}

function getReplaceableWeaponSlots(unit, unitData, totalMen = null) {
  const men = totalMen ?? getEditorTotalMen(unit, unitData);

  // If the unit has a separate NCO selector, reserve 1 model for the NCO.
  const hasSeparateNco = !!unitData?.options?.ncoReplacement;

  return Math.max(0, men - (hasSeparateNco ? 1 : 0));
}

function syncConditionalArmouryCheckboxes(unit, unitData) {
  const men = getEditorTotalMen(unit, unitData);

  const burrowing = document.querySelector('.editSquadUpgrade[data-upgrade="Burrowing Tendrils"]');

  if (burrowing) {
    const legal =
      window.currentFaction === "Flood" &&
      unit?.type === "Infantry" &&
      String(unit?.name || "").includes("Officer") &&
      men >= 2;

    if (!legal) {
      burrowing.checked = false;
      burrowing.disabled = true;
    } else {
      burrowing.disabled = false;
    }
  }

  // Jackal Defense Gauntlets:
  // Covenant: blocked by Carbines / Needle Rifles.
  // Banished: blocked by Pulse Carbines / Stalker Rifles.
  const defenseGauntlets = document.querySelector('.editSquadUpgrade[data-upgrade="Defense Gauntlets"]');
  const skirmishers = document.querySelector('.editSquadUpgrade[data-upgrade="Skirmishers"]');

  if (unit?.name === "Jackal Squad" && defenseGauntlets) {
    const hasForbiddenWeapon = jackalHasForbiddenDefenseGauntletWeapon(unit, unitData, true);

    if (hasForbiddenWeapon) {
      defenseGauntlets.checked = false;
      defenseGauntlets.disabled = true;
    } else {
      defenseGauntlets.disabled = !!(skirmishers && skirmishers.checked);
    }

    if (skirmishers) {
      if (defenseGauntlets.checked) {
        skirmishers.checked = false;
        skirmishers.disabled = true;
      } else {
        skirmishers.disabled = false;
      }

      if (skirmishers.checked) {
        defenseGauntlets.checked = false;
        defenseGauntlets.disabled = true;
      }
    }
  }
}

function clampWeaponReplacementInputs(unit, unitData, changedInput = null) {
  if (!unitData?.options?.weaponReplacements) return { used: 0, limit: 0 };

  const inputs = Array.from(document.querySelectorAll(".editWeaponReplacement"));
  const limit = getReplaceableWeaponSlots(unit, unitData);
  const selectedNcoWeapon = getSelectedNcoWeapon(unit, unitData);
  const ncoHasIncineration = selectedNcoWeapon === "Incineration Cannon";

  // First sanitize each input to >= 0 and <= its own hard max
  inputs.forEach(input => {
    const label = input.dataset.label;
    const spec = unitData.options.weaponReplacements[label];
    let hardMax = Number(spec?.max ?? limit);

if (label === "Incineration Cannon" && ncoHasIncineration) {
  hardMax = 0;
}

    let val = parseInt(input.value, 10);
    if (isNaN(val)) val = 0;

    input.value = Math.max(0, Math.min(val, hardMax));
  });

  // If one field was just changed, clamp that field against the remaining shared pool
  if (changedInput) {
    const label = changedInput.dataset.label;
    const spec = unitData.options.weaponReplacements[label];
    let hardMax = Number(spec?.max ?? limit);

if (label === "Incineration Cannon" && ncoHasIncineration) {
  hardMax = 0;
}

    const others = inputs
      .filter(i => i !== changedInput)
      .reduce((sum, i) => sum + (parseInt(i.value, 10) || 0), 0);

    let val = parseInt(changedInput.value, 10);
    if (isNaN(val)) val = 0;

    changedInput.value = Math.max(0, Math.min(val, hardMax, Math.max(0, limit - others)));
  } else {
    // Initial normalize pass
    let usedSoFar = 0;
    inputs.forEach(input => {
      const label = input.dataset.label;
      const spec = unitData.options.weaponReplacements[label];
      let hardMax = Number(spec?.max ?? limit);

if (label === "Incineration Cannon" && ncoHasIncineration) {
  hardMax = 0;
}

      let val = parseInt(input.value, 10);
      if (isNaN(val)) val = 0;

      val = Math.max(0, Math.min(val, hardMax, Math.max(0, limit - usedSoFar)));
      input.value = val;
      usedSoFar += val;
    });
  }

  const totalUsed = inputs.reduce((sum, input) => sum + (parseInt(input.value, 10) || 0), 0);

  // Update each input's max dynamically based on the shared pool
  inputs.forEach(input => {
    const label = input.dataset.label;
    const spec = unitData.options.weaponReplacements[label];
    let hardMax = Number(spec?.max ?? limit);

if (label === "Incineration Cannon" && ncoHasIncineration) {
  hardMax = 0;
}
    const current = parseInt(input.value, 10) || 0;
    const others = totalUsed - current;

    input.max = Math.max(0, Math.min(hardMax, limit - others + current));
  });

  const info = document.getElementById("editWeaponReplacementInfo");
  if (info) {
    info.textContent = `Model weapon swaps used: ${totalUsed}/${limit}`;
  }

// M301 shared limit: one M301 per full 4 models, including NCO M301.
const m301Limit = getM301Max({ ...unit, men: getEditorTotalMen(unit, unitData) });
const ncoUsesM301 = isM301ComboWeapon(getSelectedNcoWeapon(unit, unitData)) ? 1 : 0;
const m301TrooperLimit = Math.max(0, m301Limit - ncoUsesM301);
const m301Inputs = inputs.filter(input => isM301ReplacementLabel(input.dataset.label));

let m301Used = 0;
m301Inputs.forEach(input => {
  let val = parseInt(input.value, 10) || 0;
  val = Math.max(0, Math.min(val, Math.max(0, m301TrooperLimit - m301Used)));
  input.value = val;
  m301Used += val;
});

m301Inputs.forEach(input => {
  const current = parseInt(input.value, 10) || 0;
  const others = m301Used - current;
  input.max = Math.max(0, m301TrooperLimit - others + current);
});

  return { used: totalUsed, limit };
}

// Live Cost Preview for Infantry, Teams, and Vehicles
function updateLiveUnitCost() {
  const unit = window.currentEditUnit;
  if (!unit) return;

  const unitData = getUnitData(unit);
  if (!unitData) return;

  // ---- VEHICLE PREVIEW LOGIC ----
  if (unit.type !== "Infantry" && unit.type !== "Team") {
    // Gather selected upgrades
    let upgrades = [];
    document.querySelectorAll(".editVehicleUpgrade:checked").forEach(cb => upgrades.push(cb.value));
    let allUpgrades = new Set(upgrades);

    upgrades.forEach(u => addRequired(u, allUpgrades, unitData.options?.weaponUpgrades));
    let upgradeList = Array.from(allUpgrades);

    // Calculate total cost
    let baseCost = (unitData.costs && unitData.costs[unit.veterancy]) || 0;
    let totalCost = baseCost;
    let upgradesCounted = new Set();

    upgradeList.forEach(upgLabel => {
      const upg = unitData.options?.weaponUpgrades?.[upgLabel];
      if (!upg || upgradesCounted.has(upgLabel)) return;
      totalCost += Number(upg.cost) || 0;
      upgradesCounted.add(upgLabel);
    });

    const forcedCV = document.getElementById("editForcedCommandVehicle");
    if (forcedCV && forcedCV.checked) totalCost += 10;

    // Show preview
    let prevDiv = document.getElementById("modalCostPreview");
    if (prevDiv) prevDiv.innerText = `Cost: ${totalCost} pts (preview)`;
    return;
  }

  // ---- INFANTRY & TEAM LOGIC ----
  let men;
  if (unitData.type === "Team") {
    men = unitData.baseMen;
    if (unitData.options && unitData.options.squadUpgrades) {
      Object.entries(unitData.options.squadUpgrades).forEach(([label, upgrade]) => {
        const cb = document.querySelector(`.editSquadUpgrade[data-upgrade="${label}"]`);
        if (cb && cb.checked && upgrade.addMan) men += upgrade.addMan;
      });
    }
	} else {
	  // Infantry: base men comes from the input (capped by maxMen)
	  const baseMenInputRaw = parseInt(document.getElementById("editMenInput")?.value);
	  const baseMenInput = !isNaN(baseMenInputRaw) ? baseMenInputRaw : (unit.men || unitData.baseMen);
	  const baseMenCapped = Math.min(baseMenInput, unitData.maxMen);

	  // Add bonus men from checked squad upgrades (e.g. Knight Commander)
	  let bonusMen = 0;
	  if (unitData.options?.squadUpgrades) {
		Object.entries(unitData.options.squadUpgrades).forEach(([label, upgrade]) => {
		  const cb = document.querySelector(`.editSquadUpgrade[data-upgrade="${label}"]`);
		  if (cb && cb.checked && upgrade?.addMan) bonusMen += upgrade.addMan;
		});
	  }

	  // IMPORTANT: commander does NOT count toward maxMen
	  men = baseMenCapped + bonusMen;

	  // store how many "bonus" men are free of extraMenCost
	  window.__previewBonusMenNoExtraCost = bonusMen; // because all addMan upgrades should not be charged as extraMenCost
	}
	
	if (unitData.options?.weaponReplacements) {
	  clampWeaponReplacementInputs(unit, unitData);
	}

  let veterancy = document.getElementById("editVeterancySelect")?.value || unit.veterancy;
  let baseCost = (unitData.costs && unitData.costs[veterancy]) || 0;
  let extraCost = 0;

  // Extra men cost (Infantry only, not Team)
	if (unitData.type !== "Team" && men > unitData.baseMen && unitData.options?.extraMenCost) {
	  const bonusFree = window.__previewBonusMenNoExtraCost || 0;
	  const paidMen = Math.max(unitData.baseMen, men - bonusFree); // remove commander bonus before charging extraMenCost
	  extraCost = (paidMen - unitData.baseMen) * (unitData.options.extraMenCost[veterancy] || 0);
	}

  // --- Squad Upgrades ---
  let squadUpgradesCost = 0;
  if (unitData.options && unitData.options.squadUpgrades) {
    Object.entries(unitData.options.squadUpgrades).forEach(([label, upgrade]) => {
      const cb = document.querySelector(`.editSquadUpgrade[data-upgrade="${label}"]`);
      if (cb && cb.checked) {
        if (upgrade.perModel === false) {
          squadUpgradesCost += upgrade.cost || 0; // flat cost
        } else {
          squadUpgradesCost += (upgrade.cost || 0) * men; // per model (default)
        }
      }
    });
  }

  // --- Weapon replacements ---
  let weaponReplCost = 0;
  if (unitData.options?.weaponReplacements) {
    Object.entries(unitData.options.weaponReplacements).forEach(([label, spec]) => {
      const n = parseInt(document.querySelector(`.editWeaponReplacement[data-label="${label}"]`)?.value) || 0;
      weaponReplCost += n * (spec.cost || 0);
    });
  }

  // --- NCO replacement ---
  let ncoCost = 0;
  if (unitData.options?.ncoReplacement?.costs) {
    let ncoReplacement = document.getElementById("editNcoReplacement")?.value;
    if (ncoReplacement) ncoCost = unitData.options.ncoReplacement.costs[ncoReplacement] || 0;
  }

  // --- Doctrine & doctrine upgrades ---
  let doctrineCost = 0;
  let extraDoctrineCost = 0;

  if (unitData.options && unitData.options.doctrine) {
	let doctrine = document.getElementById("editDoctrineSelect")?.value;
	let doctrineSpec = getAllowedDoctrineChoicesForUnit(unit, unitData).find(dc => dc.name === doctrine);

    if (doctrineSpec) {
      doctrineCost += (doctrineSpec.costPerModel || 0) * men;

      if (doctrineSpec.extraUpgrades) {
        doctrineSpec.extraUpgrades.forEach(upg => {
          let cb = document.querySelector(`.editDoctrineExtraUpgrade[data-upgrade="${upg.name}"]`);
          if (cb && cb.checked) {
            if (upg.costPerModel) extraDoctrineCost += upg.costPerModel * men;
            if (upg.costFlat) extraDoctrineCost += upg.costFlat;
            if (upg.cost) extraDoctrineCost += upg.cost * men;
          }
        });
      }
    }
  }

  // --- Total up! ---
  let leaderMeleeCost = getLeaderMeleeUpgradeCost(unit, unitData);
  let cost = baseCost + extraCost + squadUpgradesCost + weaponReplCost + ncoCost + doctrineCost + extraDoctrineCost + leaderMeleeCost;

  // Show preview
  let prevDiv = document.getElementById("modalCostPreview");
  if (prevDiv) prevDiv.innerText = `Cost: ${cost} pts (preview)`;
}

function getUnitsForSelector(faction) {
  // Normal behavior for all factions
  let base = (window.UNIT_LISTS?.[faction] || []).concat(window.VEHICLE_LISTS?.[faction] || []);

  // Insurrection restriction: no Spartan units.
  if (isInsurrectionArmy()) {
    base = base.filter(unit =>
      !String(unit.name || "").toLowerCase().includes("spartan")
    );
  }

  // Swords of Sanghelios restriction: no Brute units.
  if (isSwordsArmy()) {
    base = base.filter(unit =>
      !String(unit.name || "").toLowerCase().includes("brute")
    );
  }

  // Covenant army-bonus locked units.
  // Swords of Sanghelios uses Covenant as its base list, but should not unlock Caste System units.
  if (faction === "Covenant") {
    base = base.filter(unit =>
      !unit.requiresArmyBonus || unit.requiresArmyBonus === window.selectedArmyBonus
    );
  }

  // If not Flood, return normal list
  if (faction !== "Flood") return base;

  // If Flood: add borrowed vehicles from other factions (Inexperienced-capable only)
  const sourceFactions = ["UNSC", "Covenant", "Banished", "Forerunner"];
  let borrowed = [];

  sourceFactions.forEach(srcFaction => {
    const vehicles = window.VEHICLE_LISTS?.[srcFaction] || [];

    vehicles.forEach(v => {
      const vets = Array.isArray(v.allowedVeterancy) ? v.allowedVeterancy : [];

      // Only vehicles that CAN be Inexperienced
      if (!vets.includes("Inexperienced")) return;

      // Clone so we don't modify the original faction vehicle
      const cloned = JSON.parse(JSON.stringify(v));

      // Mark it as borrowed (optional but helpful later)
      cloned.isFloodBorrowed = true;
      cloned.sourceFaction = srcFaction;

      // Force Flood rule: Inexperienced only
      cloned.allowedVeterancy = ["Inexperienced"];

      // Optional label so user can tell where it came from
      cloned.name = `${cloned.name} [Corrupted Arsenal]`;

      borrowed.push(cloned);
    });
  });

  return base.concat(borrowed);
}

// --- Add selected unit to army ---
function addSelectedUnit() {
  const idx = document.getElementById("unitSelect").value;
  const faction = window.currentFaction;
  let units = getUnitsForSelector(faction);
  let unit = units[idx];
  if (!unit) return;
	if (unit.name === "Grunt Cannon Fodder Mob") {
	  if (window.currentFaction !== "Covenant" || window.selectedArmyBonus !== "Cannon Fodder") {
		alert("Grunt Cannon Fodder Mob may only be taken if Cannon Fodder is selected.");
		return;
	  }
	}

  // Use value from dropdown, as set by updateUnitOptions above
  let dropdownVeterancy = document.getElementById("veterancySelect").value;
  let veterancy = dropdownVeterancy && unit.allowedVeterancy && unit.allowedVeterancy.includes(dropdownVeterancy)
    ? dropdownVeterancy
    : (unit.allowedVeterancy && unit.allowedVeterancy[0]) || "Regular";

  // Defensive fallback for men
  let men = unit.type === "Infantry" ? (unit.baseMen || 0) : undefined;
  let baseCost = (unit.costs && unit.costs[veterancy]) || 0;
  let weapons = Array.isArray(unit.weapons) ? unit.weapons.map(w => ({ ...w })) : [];

  let newUnit = {
    name: unit.name,
    type: unit.type || "",
    veterancy,
    men,
    damageValue: unit.damageValue || "",
    transportCapacity: unit.transportCapacity ?? undefined,
    weapons,
    squadUpgrades: unit.options?.squadUpgrades ? {} : undefined,
    weaponReplacements: unit.options?.weaponReplacements ? {} : undefined,
    ncoReplacement: unit.options?.ncoReplacement ? undefined : undefined,
    extraDoctrineUpgrades: unit.options?.doctrine ? {} : undefined,
	armoury: {},
    special: Array.isArray(unit.specialRules) ? [...unit.specialRules] : (unit.specialRules ? [unit.specialRules] : []),
    forcedCommandVehicle: false,
	  // ✅ keep source info for Corrupted Arsenal vehicles
	  isFloodBorrowed: !!unit.isFloodBorrowed,
	  sourceFaction: unit.sourceFaction || null,
	  originalName: unit.originalName || unit.name,
	cost: baseCost
  };

  if (typeof newUnit.men === "undefined") newUnit.men = unit.baseMen || 0;

  // Calculate extra men cost for infantry
  if (unit.type === "Infantry" && unit.options?.extraMenCost) {
    let extraMen = newUnit.men - unit.baseMen;
    if (extraMen > 0) {
      let extraMenCost = unit.options.extraMenCost[newUnit.veterancy] || 0;
      newUnit.cost += extraMen * extraMenCost;
      console.log(`[addSelectedUnit] Extra men: +${extraMen} x ${extraMenCost}`);
    }
  }

  // Calculate squad upgrades cost (flat and per model)
  if (unit.options?.squadUpgrades && newUnit.squadUpgrades) {
    let squadUpgradesCost = 0;
    Object.entries(unit.options.squadUpgrades).forEach(([label, upgrade]) => {
      if (newUnit.squadUpgrades[label]) {
        if (upgrade.perModel === false) {
          squadUpgradesCost += upgrade.cost || 0;
        } else {
          squadUpgradesCost += (upgrade.cost || 0) * newUnit.men;
        }
      }
    });
    newUnit.cost += squadUpgradesCost;
    if (squadUpgradesCost > 0) console.log(`[addSelectedUnit] Squad upgrades cost added: ${squadUpgradesCost}`);
  }

  // Show default doctrine label immediately.
  // Example:
  // "For Humanity’s Survival!" -> "For Humanity’s Survival! [Trooper]"
  // "For The Great Journey!"   -> "For The Great Journey! [Grunt/Jackal]"
  // "Forged In Chains"         -> "Forged In Chains [Grunt/Jackal]"
  if (unit.options?.doctrine) {
    addDoctrineSpecialRules(newUnit);
  }

  // Always build weaponsTable for export/PDF
  newUnit.weaponsTable = buildWeaponsTable(newUnit);

  console.log("[addSelectedUnit] Added:", newUnit.name, { newUnit });

  window.armyList.push(newUnit);
  renderArmyList();
}

	Object.entries(unitData.options.squadUpgrades).forEach(([label, upgrade]) => {
	  let checked = unit.squadUpgrades && unit.squadUpgrades[label] ? "checked" : "";
	  let disabled = "";

	  if (upgrade.allowedVeterancy && !upgrade.allowedVeterancy.includes(unit.veterancy)) {
		disabled = "disabled";
		checked = "";
	  }
		if (upgrade.conflictsWith && unit.squadUpgrades) {
		  const conflicts = Array.isArray(upgrade.conflictsWith) ? upgrade.conflictsWith : [upgrade.conflictsWith];
		  if (conflicts.some(conflict => unit.squadUpgrades[conflict])) {
			disabled = "disabled";
			checked = "";
		  }
		}
      if (upgrade.restriction === "notWithDefenseGauntlets" && unit.squadUpgrades && unit.squadUpgrades["Defense Gauntlets"])
        disabled = "disabled";

      if (upgrade.restriction === "noCarbineOrNeedleRifle" &&
        ((unit.weaponReplacements && (unit.weaponReplacements["Carbines"] > 0 || unit.weaponReplacements["Needle Rifles"] > 0))))
        disabled = "disabled";

      html += `<label>
        <input type="checkbox" class="editSquadUpgrade" data-upgrade="${label}" ${checked} ${disabled} onchange="/Melee Weapon/i.test(this.dataset.upgrade) ? rerenderCurrentEditModal() : syncInfantryEditorState()">
        ${label} (${Number(upgrade.cost) >= 0 ? "+" : "-"}${Math.abs(Number(upgrade.cost))} pts${upgrade.perModel === false ? " flat" : " per model"}) ${upgrade.grantsRule ? "– Grants: " + upgrade.grantsRule : ""}
      </label><br>`;
    });
    html += `</div>`;
  }

  // Weapon Replacements
	if (unitData.options && unitData.options.weaponReplacements) {
	  html += `<div style="margin-top:10px;"><b>Weapon Replacements:</b><br>`;
	  Object.entries(unitData.options.weaponReplacements).forEach(([label, spec]) => {
		const curr = (unit.weaponReplacements && unit.weaponReplacements[label]) || 0;
		html += `
		  <label>${label}:
			<input type="number" class="editWeaponReplacement" data-label="${label}" min="0" max="${spec.max}" value="${curr}" style="width:40px;" oninput="syncInfantryEditorState(this)">
			${spec.isM301
			  ? `(M301 package, ${Number(spec.cost) >= 0 ? "+" : "-"}${Math.abs(Number(spec.cost))} pts each)`
			  : `(max ${spec.max}, ${Number(spec.cost) >= 0 ? "+" : "-"}${Math.abs(Number(spec.cost))} pts each)`
			}
		  </label><br>
		`;
	  });
	  html += `<div id="editWeaponReplacementInfo" style="margin-top:6px;font-size:12px;color:#cfd6ff;"></div>`;
	  html += `</div>`;
	}

  // NCO Weapon Replacement
  if (unitData.options && unitData.options.ncoReplacement) {
    const currNCO = unit.ncoReplacement || unitData.options.ncoReplacement.options[0];
    html += `<label style="margin-top:10px;display:block;">NCO Weapon:
      <select id="editNcoReplacement" onchange="rerenderCurrentEditModal()">`;
    unitData.options.ncoReplacement.options.forEach(opt => {
      html += `<option value="${opt}"${currNCO === opt ? " selected" : ""}>${opt}</option>`;
    });
    html += `</select></label>`;
  }
  // Leader Melee Weapon Upgrade
  // Only used for leaders/officers that do NOT have an NCO Weapon dropdown.
  const leaderMeleeOptions = !unitData.options?.ncoReplacement
    ? getLeaderMeleeUpgradeOptions(unit, unitData)
    : [];

  if (leaderMeleeOptions.length > 1) {
    const validValues = leaderMeleeOptions.map(o => o.value);
    const currentLeaderMelee = validValues.includes(unit.leaderMeleeUpgrade) ? unit.leaderMeleeUpgrade : "";

    html += `
      <label style="margin-top:10px;display:block;">Leader Melee Upgrade:
        <select id="editLeaderMeleeUpgrade" onchange="syncInfantryEditorState()">
          ${leaderMeleeOptions.map(opt => `
            <option value="${opt.value}"${currentLeaderMelee === opt.value ? " selected" : ""}>
              ${opt.label}
            </option>
          `).join("")}
        </select>
      </label>
    `;
  }  
  // Doctrine (dropdown, dynamic extra upgrades box)
  if (unitData.options && unitData.options.doctrine) {
    html += `
      <div style="margin-top:10px;"><b>${unitData.options.doctrine.label}:</b><br>
        <select id="editDoctrineSelect" onchange="onDoctrineSelectChanged(this)">
                    <option value="">— None (${unitData.options.doctrine.defaultLabel || "Default"}) —</option>
		${getAllowedDoctrineChoicesForUnit(unit, unitData).map(choice => `
		  <option value="${choice.name}"${unit.doctrine === choice.name ? " selected" : ""}>
			${choice.name} (Special: ${choice.specialRules.join(", ")}; +${choice.costPerModel} pts/model)
		  </option>
		`).join("")}
        </select>
        <div id="doctrineExtraUpgradesBox"></div>
      </div>
    `;
  }

  // Weapon Loadout Breakdown
  html += `<div style="margin-top:14px;font-size:13px;padding:7px 0;"><b>Current Weapon Loadout:</b><br>`;
  let weaponLines = [];
  try {
    weaponLines = getInfantryWeaponCounts(unit, unitData);
  } catch (e) {
    console.error("getInfantryWeaponCounts error:", e, { unit, unitData });
    weaponLines = ["[Error calculating weapons]"];
  }
  weaponLines.forEach(line => { html += `<div>${line}</div>`; });
  html += `</div>`;

  html += `<div class="cost-preview" id="modalCostPreview"></div>`;
  return html;
}

// Weapon Breakdown Utility (never outputs undefined, always accurate)
function getInfantryWeaponCounts(unit, unitData) {
  let ncoWeapon = unit.ncoReplacement || (unitData.options?.ncoReplacement?.options ? unitData.options.ncoReplacement.options[0] : null);

  // Build a count of all valid weapons (ignore NCO for now)
  let weaponsArray = Array.isArray(unit.weapons) ? unit.weapons.filter(w => w && w.name) : [];
  let weaponCounts = {};
  let validNcoWeapon = false;

  weaponsArray.forEach(w => {
    let name = w.name;
    if (!name) return;
    if (ncoWeapon && name === ncoWeapon) {
      validNcoWeapon = true;
      return; // skip NCO for now
    }
    weaponCounts[name] = (weaponCounts[name] || 0) + 1;
  });

  // Defensive fallback
  if (Object.keys(weaponCounts).length === 0 && (!ncoWeapon || !validNcoWeapon)) {
    return ["[No valid weapons found]"];
  }

  let weaponLines = [];
  for (let [weapon, count] of Object.entries(weaponCounts)) {
    if (count > 0) weaponLines.push(`${count}x ${weapon}`);
  }

  // Always display NCO if present
  if (ncoWeapon) weaponLines.push(`NCO: ${ncoWeapon}`);

  return weaponLines;
}

// VEHICLE MODAL FIELDS, with live preview
function renderVehicleUpgradeFields(unit, unitData) {
  const rawUpgrades = unitData.options?.weaponUpgrades || {};
	const isTransportVehicle = String(unit?.forceOrgSlot || unitData?.forceOrgSlot || "").toLowerCase() === "transport";

	const upgrades = isTransportVehicle
	  ? Object.fromEntries(Object.entries(rawUpgrades).filter(([label]) => label !== "Command Vehicle"))
	  : rawUpgrades;
  const maxWeaponUpgrades = unitData.options?.maxWeaponUpgrades ?? Infinity;
  let currentSelected = sanitizeVehicleUpgradeSelection(
    new Set(unit.selectedUpgrades || []),
    upgrades,
    maxWeaponUpgrades
  );
  const canForceCV = canForceCommandVehicle(unit, unitData);

  function getRequired(set) {
    let required = new Set();

    function addReqs(upgLabel) {
      const upg = upgrades[upgLabel];
      if (!upg || !upg.requires) return;

      const reqs = Array.isArray(upg.requires) ? upg.requires : [upg.requires];
      reqs.forEach(dep => {
        if (dep && !required.has(dep)) {
          required.add(dep);
          addReqs(dep);
        }
      });
    }

    set.forEach(addReqs);
    return required;
  }

  function getUsedSlots(set) {
    const slots = new Set();

    set.forEach(label => {
      const slot = upgrades?.[label]?.slot;
      if (slot) slots.add(slot);
    });

    return slots;
  }

  function renderCheckboxes(container, checkedSet) {
    let required = getRequired(checkedSet);
    let allChecked = new Set([...checkedSet, ...required]);
    let usedSlots = getUsedSlots(allChecked);

    const max = Number.isFinite(Number(maxWeaponUpgrades)) ? Number(maxWeaponUpgrades) : Infinity;
    const maxReached = checkedSet.size >= max;

    container.innerHTML = "";

    Object.entries(upgrades).forEach(([label, upg]) => {
      const id = `upg-${Math.random().toString(36).substr(2, 6)}`;

      const isChecked = allChecked.has(label);
      const isRequired = required.has(label);
      const slot = upg.slot || null;
      const slotAlreadyUsed = slot && usedSlots.has(slot) && !isChecked;

      const shouldDisable =
        isRequired ||
        (!isChecked && maxReached) ||
        slotAlreadyUsed;

      let checked = isChecked ? "checked" : "";
      let disabled = shouldDisable ? "disabled" : "";

      container.innerHTML += `
        <label>
          <input type="checkbox" class="editVehicleUpgrade" value="${label}" id="${id}" ${checked} ${disabled}>
          ${label} (${Number(upg.cost) >= 0 ? "+" : "-"}${Math.abs(Number(upg.cost))} pts)
        </label><br>
      `;
    });

    if (canForceCV) {
      container.innerHTML += `
        <label>
          <input type="checkbox" id="editForcedCommandVehicle" ${unit.forcedCommandVehicle ? "checked" : ""}>
          Force Command Vehicle (+10 pts)
        </label><br>
      `;
    }
  }

  let html = `<div style="margin-top:10px;"><b>Vehicle Upgrades:</b><br><div id="upgradeBoxList"></div></div>`;

  setTimeout(() => {
    const container = document.getElementById("upgradeBoxList");
    renderCheckboxes(container, currentSelected);

    function refresh() {
      let checkedNow = Array.from(container.querySelectorAll('.editVehicleUpgrade:checked')).map(cb => cb.value);

      currentSelected = sanitizeVehicleUpgradeSelection(
        new Set(checkedNow),
        upgrades,
        maxWeaponUpgrades
      );

      renderCheckboxes(container, currentSelected);
      attach();
      updateLiveUnitCost();
    }

    function attach() {
      container.querySelectorAll('.editVehicleUpgrade').forEach(cb => {
        cb.addEventListener("change", refresh);
      });

      const forced = document.getElementById("editForcedCommandVehicle");
      if (forced) forced.addEventListener("change", updateLiveUnitCost);
    }

    attach();
    updateLiveUnitCost();
  }, 10);

  html += `<div class="cost-preview" id="modalCostPreview"></div>`;
  return html;
}

function saveEdit() {
  if (editIdx == null) return;

  const unit = window.armyList[editIdx];
  let unitData = getUnitData(unit);

  console.log("[saveEdit] Editing unit:", unit?.name, { unit, unitData });
  if (!unit || !unitData) return;

  // INFANTRY & TEAMS
  if (unit.type === "Infantry" || unit.type === "Team") {
    // Men count
    if (unit.type === "Infantry") {
      let val = parseInt(document.getElementById("editMenInput")?.value, 10);
      const minMen = unitData.baseMen || 0;
      const maxMen = unitData.maxMen ?? minMen;

      if (isNaN(val)) val = unit.men || minMen;
      unit.men = Math.max(minMen, Math.min(maxMen, val));
    }

	// Squad Upgrades
	if (unitData.options && unitData.options.squadUpgrades) {
	  unit.squadUpgrades = {};
	  document.querySelectorAll(".editSquadUpgrade").forEach(cb => {
		unit.squadUpgrades[cb.dataset.upgrade] = cb.checked;
	  });

	  // Enforce conflicts between squad upgrades, e.g. Hydra vs Spartan Laser
	  if (unit.squadUpgrades && unitData.options?.squadUpgrades) {
		Object.entries(unitData.options.squadUpgrades).forEach(([label, upgrade]) => {
		  if (!unit.squadUpgrades[label] || !upgrade.conflictsWith) return;

		  const conflicts = Array.isArray(upgrade.conflictsWith)
			? upgrade.conflictsWith
			: [upgrade.conflictsWith];

		  conflicts.forEach(conflict => {
			if (unit.squadUpgrades[conflict]) {
			  unit.squadUpgrades[conflict] = false;
			}
		  });
		});
	  }

	  enforceOnePerArmySquadUpgrade("Sacred Relic");
	  enforceXM20PGrenadeLimit();

	}

    // NCO Weapon
    if (unitData.options && unitData.options.ncoReplacement) {
      const ncoReplacement = document.getElementById("editNcoReplacement")?.value;
      if (ncoReplacement) unit.ncoReplacement = ncoReplacement;

      // NCO dropdown handles Plasma Sword / Gravity Hammer combos for this unit.
      unit.leaderMeleeUpgrade = "";
    }
    // Leader Melee Upgrade
    // Only used for leaders/officers that do NOT have an NCO Weapon dropdown.
    if (!unitData.options?.ncoReplacement) {
      const leaderMeleeSelect = document.getElementById("editLeaderMeleeUpgrade");
      if (leaderMeleeSelect) {
        unit.leaderMeleeUpgrade = leaderMeleeSelect.value || "";
      } else {
        unit.leaderMeleeUpgrade = "";
      }

      const validLeaderMeleeValues = getLeaderMeleeUpgradeOptions(unit, unitData).map(o => o.value);
      if (!validLeaderMeleeValues.includes(unit.leaderMeleeUpgrade)) {
        unit.leaderMeleeUpgrade = "";
      }
    } else {
      unit.leaderMeleeUpgrade = "";
    }
    // Doctrine & doctrine extra upgrades
    if (unitData.options && unitData.options.doctrine) {
		const doctrineSelect = document.getElementById("editDoctrineSelect");
		const allowedDoctrineChoices = getAllowedDoctrineChoicesForUnit(unit, unitData);

		unit.doctrine = doctrineSelect ? doctrineSelect.value : null;
		if (!allowedDoctrineChoices.some(dc => dc.name === unit.doctrine)) {
		  unit.doctrine = null;
		}

		unit.extraDoctrineUpgrades = {};
		let doctrineSpec = allowedDoctrineChoices.find(dc => dc.name === unit.doctrine);

      if (doctrineSpec && doctrineSpec.extraUpgrades) {
        doctrineSpec.extraUpgrades.forEach(upg => {
          let cb = document.querySelector(`.editDoctrineExtraUpgrade[data-upgrade="${upg.name}"]`);
          unit.extraDoctrineUpgrades[upg.name] = !!(cb && cb.checked);
        });
      }
    } else {
      unit.doctrine = null;
      unit.extraDoctrineUpgrades = {};
    }

    // MEN COUNT for TEAMS (handle addMan from upgrades)
    if (unit.type === "Team") {
      let men = unitData.baseMen;
      if (unit.squadUpgrades && unitData.options && unitData.options.squadUpgrades) {
        Object.entries(unit.squadUpgrades).forEach(([label, picked]) => {
          let upgrade = unitData.options.squadUpgrades[label];
          if (picked && upgrade && upgrade.addMan) men += upgrade.addMan;
        });
      }
      unit.men = men;
    }
	// MEN COUNT for INFANTRY (allow addMan upgrades WITHOUT counting toward maxMen)
	if (unit.type === "Infantry") {
	  const baseMenInputRaw = parseInt(document.getElementById("editMenInput")?.value);
	  const baseMenInput = !isNaN(baseMenInputRaw) ? baseMenInputRaw : (unit.men || unitData.baseMen);
	  const baseMenCapped = Math.min(baseMenInput, unitData.maxMen);

	  let bonusMen = 0;
	  if (unit.squadUpgrades && unitData.options?.squadUpgrades) {
		Object.entries(unit.squadUpgrades).forEach(([label, picked]) => {
		  if (!picked) return;
		  const upgrade = unitData.options.squadUpgrades[label];
		  if (upgrade?.addMan) bonusMen += upgrade.addMan;
		});
	  }

	  // commander doesn't count toward maxMen
	  unit.men = baseMenCapped + bonusMen;

	  // store for cost calc (so we don't charge extraMenCost for bonus models)
	  unit._bonusMenNoExtraCost = bonusMen;
	}

	// Refresh unitData after doctrine/men changes, then purge illegal armoury upgrades.
	// This prevents stale armoury options like MJOLNIR, Sacred Relic, or Trophy Plate Harness.
	unitData = getUnitData(unit);
	purgeIllegalArmourySquadUpgrades(unit, unitData);

  if (!leaderHasMeleeWeapon(unit, unitData)) {
    clearIllegalLeaderMeleeSelections(unit, unitData);
  }

  unitData = getUnitData(unit);
	
    // Remove conditional armoury upgrades that are no longer legal.
    if (unit.squadUpgrades?.["Burrowing Tendrils"] && unit.men < 2) {
      unit.squadUpgrades["Burrowing Tendrils"] = false;
    }
	
        // Weapon Replacements (after final men count is known)
    if (unitData.options && unitData.options.weaponReplacements) {
      clampWeaponReplacementInputs(unit, unitData);

      unit.weaponReplacements = {};
      Object.entries(unitData.options.weaponReplacements).forEach(([label]) => {
        const n = parseInt(document.querySelector(`.editWeaponReplacement[data-label="${label}"]`)?.value, 10) || 0;
        unit.weaponReplacements[label] = n;
      });
      purgeIllegalM301Selections(unit);
    }

    // Enforce Jackal Defense Gauntlet weapon restrictions.
    // If forbidden weapons are present, Defense Gauntlets are removed rather than warned.
    if (
      unit.squadUpgrades?.["Defense Gauntlets"] &&
      jackalHasForbiddenDefenseGauntletWeapon(unit, unitData, false)
    ) {
      unit.squadUpgrades["Defense Gauntlets"] = false;
    }

    // WEAPONS (robust swaps from squad upgrades)
    let weapons = Array.isArray(unitData.weapons) ? unitData.weapons.map(w => ({ ...w })) : [];
    if (unitData.options && unitData.options.squadUpgrades && unit.squadUpgrades) {
      Object.entries(unitData.options.squadUpgrades).forEach(([label, upgrade]) => {
        if (unit.squadUpgrades[label] && upgrade.grantsRule && upgrade.replacesWeapon) {
          const oldName = upgrade.replacesWeapon.trim().toLowerCase();
          weapons = weapons.filter(w => w.name && w.name.trim().toLowerCase() !== oldName);

          const newName = String(upgrade.grantsRule).trim();
          if (newName && !weapons.some(w => w.name && w.name.trim().toLowerCase() === newName.toLowerCase())) {
            weapons.push({ name: newName });
          }
        }
      });
    }
    unit.weapons = weapons;

    // COST CALCULATION
    let veterancy = unit.veterancy || "Regular";
    let baseCost = (unitData.costs && unitData.costs[veterancy] !== undefined) ? unitData.costs[veterancy] : 0;
    let men = (unit.men !== undefined) ? unit.men : (unitData.baseMen || 0);

	let extraCost = 0;
	if (unit.type !== "Team" && men > unitData.baseMen && unitData.options?.extraMenCost) {
	  const extraMenCost = unitData.options.extraMenCost?.[veterancy] || 0;
	  const bonusFree = unit._bonusMenNoExtraCost || 0;
	  const paidMen = Math.max(unitData.baseMen, men - bonusFree); // don't charge for commander bonus model
	  extraCost = (paidMen - unitData.baseMen) * extraMenCost;
	}

    let squadUpgradesCost = 0;
    if (unit.squadUpgrades && unitData.options && unitData.options.squadUpgrades) {
      Object.entries(unit.squadUpgrades).forEach(([label, picked]) => {
        if (!picked) return;
        let upgrade = unitData.options.squadUpgrades[label];
        if (!upgrade) return;
        squadUpgradesCost += (upgrade.perModel === false)
          ? (upgrade.cost || 0)
          : (upgrade.cost || 0) * men;
      });
    }

    let weaponReplCost = 0;
    if (unit.weaponReplacements && unitData.options?.weaponReplacements) {
      Object.entries(unit.weaponReplacements).forEach(([label, qty]) => {
        let per = unitData.options.weaponReplacements[label]?.cost || 0;
        weaponReplCost += (qty || 0) * per;
      });
    }

    let ncoCost = 0;
    if (unit.ncoReplacement && unitData.options?.ncoReplacement?.costs) {
      ncoCost = unitData.options.ncoReplacement.costs[unit.ncoReplacement] || 0;
    }

    let doctrineCost = 0;
    let extraDoctrineCost = 0;

    // SPECIAL RULES: BASE + DOCTRINE
    let specialRules = Array.isArray(unitData.specialRules) ? [...unitData.specialRules] : [];

    if (unitData.options && unitData.options.doctrine && unit.doctrine) {
      let doctrine = (unitData.options.doctrine.choices || []).find(dc => dc.name === unit.doctrine);
      if (doctrine) {
        doctrineCost += (doctrine.costPerModel || 0) * men;

        specialRules.unshift(unitData.options.doctrine.label + " [" + unit.doctrine + "]");

        (doctrine.specialRules || []).forEach(r => {
          if (r && !specialRules.includes(r)) specialRules.push(r);
        });

        if (unit.extraDoctrineUpgrades && doctrine.extraUpgrades) {
          doctrine.extraUpgrades.forEach(upg => {
            if (!unit.extraDoctrineUpgrades[upg.name]) return;

            if (upg.costPerModel) extraDoctrineCost += upg.costPerModel * men;
            if (upg.costFlat) extraDoctrineCost += upg.costFlat;
            if (upg.cost) extraDoctrineCost += upg.cost * men;

            if (upg.grantsRule && !upg.replacesWeapon && !specialRules.includes(upg.grantsRule)) {
              specialRules.push(upg.grantsRule);
            } else if (!upg.grantsRule && !specialRules.includes(upg.name)) {
              specialRules.push(upg.name);
            }
          });
        }
      }
    }

    // Special rules from squad upgrades (supports string or array), skip weapon swaps
    if (unit.squadUpgrades && unitData.options?.squadUpgrades) {
      Object.entries(unit.squadUpgrades).forEach(([label, picked]) => {
        const upgrade = unitData.options.squadUpgrades[label];
        if (!picked || !upgrade || upgrade.replacesWeapon) return;

        // remove replaced rules (string or array)
        if (upgrade.replacesRule) {
          const toRemove = Array.isArray(upgrade.replacesRule) ? upgrade.replacesRule : [upgrade.replacesRule];
          specialRules = specialRules.filter(r => !(typeof r === "string" && toRemove.includes(r)));
        }

        // add granted rules (string or array)
        const grantList = Array.isArray(upgrade.grantsRule)
          ? upgrade.grantsRule
          : (upgrade.grantsRule ? [upgrade.grantsRule] : []);

        grantList.forEach(rule => {
          if (rule && !specialRules.includes(rule)) specialRules.push(rule);
        });

        if (Array.isArray(upgrade.grantsRules)) {
          upgrade.grantsRules.forEach(rule => {
            if (rule && !specialRules.includes(rule)) specialRules.push(rule);
          });
        }
      });
    }

	// Apply any special-rule transformations first.
	specialRules = applyVolatileBiomassSpecialRules(unit, specialRules);

	// M301 cleanup:
	// Remove any old/duplicate M301 rule, then add it back once if the unit currently has M301.
	specialRules = specialRules.filter(r => getRuleName(r) !== "M301 Grenade Launcher");

	if (unitHasM301(unit, unitData)) {
	  specialRules.push("M301 Grenade Launcher");
	}
	// FINALIZE SPECIAL RULES and add doctrine display rules if applicable
	unit.special = specialRules;
	if (unitData.options && unitData.options.doctrine) addDoctrineSpecialRules(unit);
    let leaderMeleeCost = getLeaderMeleeUpgradeCost(unit, unitData);
    unit.cost = baseCost + extraCost + squadUpgradesCost + weaponReplCost + ncoCost + doctrineCost + extraDoctrineCost + leaderMeleeCost;

    if (isNaN(unit.cost) || unit.cost < 0) unit.cost = 0;
  }

  // VEHICLES: weapon upgrades with forced logic
  if (unit.type !== "Infantry" && unit.type !== "Team") {
	const vehicleUpgradesDef = unitData.options?.weaponUpgrades || {};

	let upgrades = Array.from(sanitizeVehicleUpgradeSelection(
	  new Set(Array.from(document.querySelectorAll(".editVehicleUpgrade:checked")).map(cb => cb.value)),
	  vehicleUpgradesDef,
	  unitData.options?.maxWeaponUpgrades
	));

    let allUpgrades = new Set(upgrades);
    function addReq(upgLabel) {
      const upg = vehicleUpgradesDef[upgLabel];
      if (!upg || !upg.requires) return;
      const reqs = Array.isArray(upg.requires) ? upg.requires : [upg.requires];
      reqs.forEach(dep => {
        if (dep && !allUpgrades.has(dep)) {
          allUpgrades.add(dep);
          addReq(dep);
        }
      });
    }
    upgrades.forEach(addReq);

    unit.selectedUpgrades = Array.from(allUpgrades);

    const forcedCVBox = document.getElementById("editForcedCommandVehicle");
    unit.forcedCommandVehicle = !!(forcedCVBox && forcedCVBox.checked);

    const baseCost = (unitData.costs && unitData.costs[unit.veterancy]) || 0;
    let totalCost = baseCost;
    let weapons = Array.isArray(unitData.weapons) ? unitData.weapons.map(w => ({ ...w })) : [];

    const removeLabels = new Set();
    let addWeapons = [];
    const upgradesCounted = new Set();
    const grantedRules = [];

    unit.selectedUpgrades.forEach(upgLabel => {
      const upg = vehicleUpgradesDef[upgLabel];
      if (!upg || upgradesCounted.has(upgLabel)) return;

      totalCost += (Number(upg.cost) || 0);
      upgradesCounted.add(upgLabel);

      if (upg.replaces) (Array.isArray(upg.replaces) ? upg.replaces : [upg.replaces]).forEach(r => r && removeLabels.add(r));
      if (upg.addsWeapon) (Array.isArray(upg.addsWeapon) ? upg.addsWeapon : [upg.addsWeapon]).forEach(w => w && addWeapons.push({ name: w }));

      if (upg.grantsRule) grantedRules.push(upg.grantsRule);
      if (Array.isArray(upg.grantsRules)) upg.grantsRules.forEach(r => r && grantedRules.push(r));
    });

    if (unit.forcedCommandVehicle) {
      totalCost += 10;
      grantedRules.push("Command Vehicle");
    }

    weapons = weapons.filter(w => !removeLabels.has(w.name));
    addWeapons = addWeapons.filter(newW => !removeLabels.has(newW.name));
    weapons = weapons.concat(addWeapons);

    const baseSpecialFromData = Array.isArray(unitData.specialRules) ? unitData.specialRules.slice() : [];
    const baseSpecialFromUnit = Array.isArray(unit.specialRules) ? unit.specialRules.slice()
      : Array.isArray(unit.special) ? unit.special.slice()
      : [];

    const baseSpecial = baseSpecialFromData.length ? baseSpecialFromData : baseSpecialFromUnit;
    const finalSpecial = Array.from(new Set([...baseSpecial, ...grantedRules]));

    unit.cost = isFinite(totalCost) && totalCost >= 0 ? totalCost : 0;
    unit.weapons = weapons;
    unit.specialRules = finalSpecial;
    unit.special = finalSpecial.slice();

    if (isNaN(unit.cost) || unit.cost < 0) unit.cost = 0;
  }

  // Always rebuild weapons table for HTML/PDF export
  unit.weaponsTable = buildWeaponsTable(unit);

  closeEditModal();
  renderArmyList();
}

function getDisplayUnitName(unit) {
  const baseName = unit?.name || "";
  const upgrades = unit?.squadUpgrades || {};

  const hasUpgradeStartingWith = (text) =>
    Object.entries(upgrades).some(([label, picked]) =>
      picked && String(label).startsWith(text)
    );

  // ============================================================
  // COVENANT / BANISHED UNIT VARIANTS
  // ============================================================

  // Grunt Squad with Deacon
  if (
    baseName === "Grunt Squad" &&
    hasUpgradeStartingWith("Deacon")
  ) {
    return "Grunt Deacon Squad";
  }

  // Jackal Skirmishers
  if (
    baseName === "Jackal Squad" &&
    upgrades["Skirmishers"]
  ) {
    return "Skirmisher Squad";
  }

  // Suicide Anti-Tank Team upgraded to Grunt Rider
  if (
    baseName === "Suicide Anti-Tank Team" &&
    upgrades["Grunt Rider"]
  ) {
    return "Suicide Grunt Rider Anti-Tank Team";
  }

  // Explicit Brute / Elite units.
  // Do not apply this to doctrine-based units.
  if (baseName === "Atriox’s Chosen") {
    return "Atriox’s Chosen Brute Squad";
  }

  if (baseName === "Honor Guard") {
    return "Elite Honor Guard";
  }

  // ============================================================
  // UNSC TROOPER VARIANTS
  // ============================================================

  if (baseName === "Trooper Infantry Squad") {
    const isAirborne = !!upgrades["Army Airborne"];
    const isRecon = !!upgrades["Recon Squad"];

    if (isAirborne && isRecon) {
      return "Airborne Recon Squad";
    }

    if (isAirborne) {
      return "Airborne Squad";
    }

    if (isRecon) {
      return "Recon Squad";
    }
  }

  // ============================================================
  // FORERUNNER COMMANDER VARIANT
  // ============================================================

  const hasKnightCommander =
    baseName === "Promethean Knight Team" &&
    hasUpgradeStartingWith("Knight Commander");

  if (hasKnightCommander) {
    return `${baseName} (Platoon Commander)`;
  }

  return baseName;
}

function renderArmyList() {
  const listDiv = document.getElementById("armyList");
  listDiv.innerHTML = "";

  (window.armyList || []).forEach((unit, idx) => {
    const dmgText = getDisplayDamage(unit);
    const showDamage = dmgText && String(dmgText).trim() !== "";
    const showTransport = typeof unit.transportCapacity === "number" && unit.transportCapacity > 0;

    // Weapons block
    // Always use buildWeaponsTable/getFinalWeaponsList, because that already knows about
    // M301 carriers, NCO packages, armoury profile swaps, and normal weapon counts.
    const finalWeapons = Array.isArray(getFinalWeaponsList(unit))
      ? getFinalWeaponsList(unit)
      : [];

    let weaponHtml = finalWeapons.length
      ? finalWeapons.map(w => w.label).join("<br>")
      : "—";

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h3>${getDisplayUnitName(unit)} (${unit.veterancy}, ${unit.type})</h3>
      <div class="details">
        ${unit.men ? `<div><b>Men:</b> ${unit.men}</div>` : ""}
        ${showDamage ? `<div><b>Damage:</b> ${dmgText}</div>` : ""}
        ${showTransport ? `<div><b>Transport:</b> ${unit.transportCapacity}</div>` : ""}
        <div><b>Weapons:</b><br>${weaponHtml}</div>
        <div><b>Special Rules:</b>
          <ul style="margin:6px 0 0 16px;padding:0;">
            ${
              (unit.special || []).map(ruleText => {
                const text = typeof ruleText === "string"
                  ? ruleText
                  : ruleText?.name
                    ? ruleText.name + (ruleText.description ? ": " + ruleText.description : "")
                    : "";

                const [rule, ...rest] = text.split(":");
                const extra = rest.join(":").trim();
                const summary =
                  (window.vehicleSpecialDescriptions && window.vehicleSpecialDescriptions[rule.trim()]) ||
                  (window.unitSpecialDescriptions && window.unitSpecialDescriptions[rule.trim()]) ||
                  "";
                const full = (summary ? summary + (extra ? " " : "") : "") + extra;

                return `<li style="margin-bottom:4px;"><b>${rule.trim()}</b>${
                  full ? `: <span style="color:#dde">${full.replace(/\n/g,"<br>")}</span>` : ""
                }</li>`;
              }).join("")
            }
          </ul>
        </div>
		<div><b>Cost:</b> ${unit.cost} pts</div>
		${unit.lockedByArmyBonus
		  ? `<div style="margin-top:10px;color:#b9c6ff;"><b>Army Bonus Unit:</b> ${unit.armyBonusSource} (locked basic squad)</div>`
		  : `
			<button class="edit-btn" onclick="editUnit(${idx})">Edit</button>
			<button class="remove-btn" onclick="removeUnit(${idx})">Remove</button>
		  `
		}
      </div>
    `;
    listDiv.appendChild(card);
  });
  renderSummaryBlock();
  const total = (window.armyList || []).reduce((sum, u) => sum + (Number(u.cost) || 0), 0);
  document.getElementById("totalPointsDiv").innerHTML = `<b>Total Points: ${total}</b>`;
}
